<script>
let cards=[
{f:"y=2x",range:"xの値が1から3まで増加するとき",b:"<b>xの増加量</b>：\\(3-1=2\\)<br><b>yの増加量</b>：\\(6-2=4\\)<br><b>変化の割合</b>：\\(4\\div 2=2\\)"},
{f:"y=3x-1",range:"xの値が-2から1まで増加するとき",b:"<b>xの増加量</b>：\\(1-(-2)=3\\)<br><b>yの増加量</b>：\\(2-(-7)=9\\)<br><b>変化の割合</b>：\\(9\\div 3=3\\)"},
{f:"y=-5x+1",range:"xの値が-3から2まで増加するとき",b:"<b>xの増加量</b>：\\(2-(-3)=5\\)<br><b>yの増加量</b>：\\(-9-16=-25\\)<br><b>変化の割合</b>：\\(-25\\div 5=-5\\)"},
{f:"y=\\frac{3}{4}x-3",range:"xの値が0から8まで増加するとき",b:"<b>xの増加量</b>：\\(8-0=8\\)<br><b>yの増加量</b>：\\(3-(-3)=6\\)<br><b>変化の割合</b>：\\(6\\div 8=\\frac{3}{4}\\)"},
{f:"y=2x^2",range:"xの値が2から6まで増加するとき",b:"<b>xの増加量</b>：\\(6-2=4\\)<br><b>yの増加量</b>：\\(72-8=64\\)<br><b>変化の割合</b>：\\(64\\div 4=16\\)"},
{f:"y=-x^2",range:"xの値が1から7まで増加するとき",b:"<b>xの増加量</b>：\\(7-1=6\\)<br><b>yの増加量</b>：\\(-49-(-1)=-48\\)<br><b>変化の割合</b>：\\(-48\\div 6=-8\\)"},
{f:"y=3x^2",range:"xの値が-3から4まで増加するとき",b:"<b>xの増加量</b>：\\(4-(-3)=7\\)<br><b>yの増加量</b>：\\(48-27=21\\)<br><b>変化の割合</b>：\\(21\\div 7=3\\)"},
{f:"y=\\frac{24}{x}",range:"xの値が3から12まで増加するとき",b:"<b>xの増加量</b>：\\(12-3=9\\)<br><b>yの増加量</b>：\\(2-8=-6\\)<br><b>変化の割合</b>：\\(-6\\div 9=-\\frac{2}{3}\\)"},
{f:"y=\\frac{24}{x}",range:"xの値が2から12まで増加するとき",b:"<b>xの増加量</b>：\\(12-2=10\\)<br><b>yの増加量</b>：\\(2-12=-10\\)<br><b>変化の割合</b>：\\(-10\\div 10=-1\\)"}
];
let i=0,back=false;
function render(){let c=cards[i];side.textContent=back?"裏":"表";counter.textContent=`${i+1} / ${cards.length}`;content.innerHTML=back?`<div class="no">問題 ${i+1}</div><div class="back">${c.b}</div>`:`<div class="no">問題 ${i+1}</div><div class="front">\\\(${c.f}\\\)</div><div class="cond">${c.range}</div><div class="ask">xの増加量、yの増加量、変化の割合を求めなさい</div>`;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([content])}
function flip(e){e?.stopPropagation();back=!back;render()} function next(e){e?.stopPropagation();i=(i+1)%cards.length;back=false;render()} function prev(e){e?.stopPropagation();i=(i-1+cards.length)%cards.length;back=false;render()}
function shuffleCards(e){e?.stopPropagation();cards.sort(()=>Math.random()-.5);i=0;back=false;render()}
card.onclick=()=>flip();let sx=0;card.addEventListener("touchstart",e=>sx=e.changedTouches[0].clientX,{passive:true});card.addEventListener("touchend",e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>55){d<0?next():prev()}},{passive:true});render();
</script>
<script id="mugen-function-mobile-fit-script">
(function(){
 var queued=false;
 function fit(){
  queued=false;
  // CSS handles MathJax SVG scaling; this also covers formulas before typesetting.
  document.querySelectorAll('.math-wrap .math').forEach(function(el){
   el.style.removeProperty('font-size');
   if(el.querySelector('mjx-container'))return;
   var width=el.parentElement.clientWidth;
   if(width>0&&el.scrollWidth>width){
    el.style.fontSize=Math.max(1,parseFloat(getComputedStyle(el).fontSize)*(width-4)/el.scrollWidth)+'px';
   }
  });
 }
 function queue(){if(!queued){queued=true;requestAnimationFrame(fit);}}
 if(window.MutationObserver)new MutationObserver(queue).observe(document.body,{childList:true,subtree:true});
 if(window.ResizeObserver)new ResizeObserver(queue).observe(document.querySelector('.wrap')||document.querySelector('main')||document.body);
 window.addEventListener('resize',queue);
 window.addEventListener('pageshow',queue);
 if(window.visualViewport)window.visualViewport.addEventListener('resize',queue);
 if(document.fonts)document.fonts.ready.then(queue);
 queue();
})();
</script></body></html>
