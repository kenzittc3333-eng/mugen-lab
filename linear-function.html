<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff890d">
<title>一次関数・1問1答フラッシュカード｜総合教育研究所 無限の可能性</title>
<style>
:root{--burnt:#8b3d12;--orange:#f78915;--deep:#d56804;--peach:#fff2d9;--paper:#fffcf7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#ff9415 0%,#ffc65a 260px,#fff4df 500px,#fffbf7 100%);color:var(--burnt);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:0 13px 26px}
.header{position:relative;min-height:211px;margin:12px 0 10px;background:radial-gradient(circle at 60% 18%,#ffe8a2,transparent 50%),linear-gradient(145deg,#ffaf34,#ff7900);border:3px solid #ffdf8a;border-radius:27px;box-shadow:0 8px 0 #dd7304;display:flex;align-items:center;padding:14px 18px 14px 192px;overflow:hidden}
.hero{position:absolute;left:0;bottom:-8px;width:198px;height:206px;object-fit:contain;filter:drop-shadow(0 3px 3px #a94d0063)}
.brand{position:relative;text-align:center;width:100%;font-weight:900;color:#fff;text-shadow:0 2px 1px #964100}
.brand small{display:block;font-size:clamp(13.2px,3.12vw,20.4px);margin-bottom:5px;color:#6b310f;background:#fffaf4;padding:4px 10px;border-radius:30px;letter-spacing:.035em;text-shadow:none}
.brand h1{font-size:clamp(34.8px,6.48vw,56.4px);line-height:1.16;margin:6px 0 8px;letter-spacing:.025em}
.brand em{font-style:normal;color:#fff8d8;font-size:clamp(14.4px,2.64vw,19.2px)}
.symbol{display:inline-block;background:linear-gradient(135deg,#ffe674,#fffbec);color:#de6b00;border:2px solid #fff9e3;border-radius:50%;box-shadow:0 3px 0 #bd5900;text-shadow:none;width:34px;height:34px;line-height:28px;font-size:27.6px;vertical-align:middle;margin-right:3px}
.nav{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:8px;margin:17px 0 10px}
button,select{font-family:inherit;cursor:pointer}
.nav button,.nav select,.action button{border:0;border-radius:14px;padding:12px 7px;color:white;background:linear-gradient(#ff9c21,#ef6800);box-shadow:0 4px 0 #b94a00;font-weight:900;font-size:clamp(15.6px,3vw,21.6px)}
.nav select{background:#fff;color:#833b17;border:2px solid #ed8a23;box-shadow:0 3px 0 #efca8c}
.nav button:active,.action button:active{transform:translateY(3px);box-shadow:0 1px 0 #b94a00}
.progress{background:#fff7e9;border:2px solid #ffd090;border-radius:13px;padding:9px 14px;margin:8px 0 10px;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:900}
.track{flex:1;height:10px;background:#f7d5a7;border-radius:12px;overflow:hidden}.fill{width:0;height:100%;background:linear-gradient(90deg,#ffb03e,#ee6a00);transition:width .25s}
.card{position:relative;overflow:hidden;background:var(--paper);border:5px solid #f58b18;border-radius:28px;min-height:660px;box-shadow:0 10px 24px #c0782340;padding:62px 25px 120px;touch-action:pan-y;user-select:none}
.card .tag{position:absolute;left:16px;top:14px;background:linear-gradient(#ffa52b,#ee6900);border-radius:20px;padding:8px 13px;color:#fff;font-weight:900;font-size:16.8px}
.card .side{position:absolute;right:16px;top:14px;color:#c65a00;border:2px solid #ffc477;padding:6px 14px;font-weight:900;border-radius:30px;font-size:16.8px;background:#fff5e7}
.card-inner{position:relative;z-index:2;text-align:center;max-width:720px;margin:0 auto;min-height:425px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.problem{font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN","MS PMincho",serif;font-size:clamp(26.4px,5.04vw,42px);font-weight:700;line-height:1.66;margin:0 0 6px;letter-spacing:.01em}
.equation{font-family:Georgia,"Times New Roman",serif;font-size:clamp(44.4px,8.4vw,80.4px);line-height:1.35;font-weight:700;margin:3px 0 8px;color:#8a3c0e;white-space:normal}
.answer .equation{color:#df5c00}
.smallEquation{font-size:clamp(30px,6vw,46.8px)}
.note{font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(21.6px,4.44vw,32.4px);font-weight:700;line-height:1.65;margin:8px 0}
.answerLabel{color:#d56600;font-weight:900;font-size:clamp(28.8px,5.04vw,43.2px);margin:4px 0}
.step{font-size:clamp(20.4px,3.6vw,27.6px);line-height:1.7;padding:10px 15px;background:#fff2df;border-left:5px solid #ff9524;border-radius:10px;text-align:left;margin:7px auto 0;max-width:560px}
.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;line-height:1.03;min-width:.65em;font-size:.80em;margin:0 .09em}.frac .up{padding:0 .12em .04em;border-bottom:2px solid currentColor}.frac .down{padding:.06em .12em 0}
.gridview{position:relative;width:min(552px,117.6%);max-width:none;aspect-ratio:1;margin:6px auto 2px;flex-shrink:0}
.gridview canvas{display:block;width:100%;height:100%;background:#fff;border:2px solid #ffbb5a;border-radius:17px}
.tableScroll{max-width:100%;overflow-x:auto}.mathTable{border-collapse:collapse;background:#fff;margin:5px auto;font-family:Georgia,serif;font-size:clamp(21.6px,5.4vw,36px)}.mathTable th,.mathTable td{padding:8px 12px;border:2px solid #d5812a;text-align:center;min-width:47px}.mathTable th{background:#ffefd3}
.decor{position:absolute;right:5px;bottom:9px;z-index:1;width:174px;height:192px;object-fit:contain;opacity:.94;pointer-events:none;filter:drop-shadow(0 2px 2px #66330030)}
.hint{font-weight:800;color:#b45b09;opacity:.9;font-size:15.6px;position:absolute;bottom:15px;left:16px;right:178px}
.action{display:flex;justify-content:center;gap:9px;margin:14px 0}.action button{flex:1;max-width:280px;padding:13px 8px;font-size:clamp(18px,3.6vw,24px)}
.footer{text-align:center;margin:12px 0;color:#975121;font-weight:800;font-size:16.8px;line-height:1.75}
@media(max-width:620px){.wrap{padding:0 8px 16px}.header{min-height:174px;padding:10px 8px 10px 128px;border-radius:19px;margin-top:6px}.hero{width:131px;height:173px;left:-6px;bottom:-6px}.brand h1{font-size:clamp(28.8px,8.4vw,42px)}.brand small{font-size:clamp(10.8px,3.24vw,14.4px);padding:4px 3px}.brand em{font-size:13.2px}.symbol{width:25px;height:25px;line-height:20px;font-size:21.6px}.nav{grid-template-columns:1fr 1fr 1fr;gap:6px}.nav select{grid-column:1/-1;grid-row:1}.nav button{padding:11px 4px;font-size:15.6px}.card{border-width:4px;border-radius:22px;min-height:690px;padding:58px 13px 119px}.card-inner{min-height:445px;gap:6px}.problem{font-size:clamp(25.2px,6.84vw,36px)}.equation{font-size:clamp(43.2px,10.8vw,61.2px)}.smallEquation{font-size:clamp(26.4px,7.2vw,38.4px)}.gridview{width:min(498px,calc(100vw - 28px))}.decor{width:132px;height:152px;bottom:3px}.hint{font-size:13.2px;right:126px}.step{padding:8px 10px;font-size:19.2px}.mathTable th,.mathTable td{padding:7px;min-width:42px}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
/* タッチを中心に、グラフ拡大時は左右を均等に配置する */
.gridview{touch-action:pan-y}
.card{padding-bottom:155px}
@media(max-width:620px){.card{padding-left:6px;padding-right:6px;padding-bottom:159px}.card-inner{min-height:0}}

/* グラフから式を求める：1.3倍拡大。スマホは左右スクロールで座標の端も読める。 */
.readGraphFrame{width:100%;max-width:720px;margin:8px auto 5px}
.readGraphFrame .graphViewport{width:100%;max-width:720px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#d89042 #fff2dd;border-radius:17px;touch-action:pan-x pan-y}
.readGraphFrame .gridview{width:min(552px,100%)!important;max-width:none!important;flex-shrink:0!important;margin:0 auto 3px!important}
.readGraphFrame.zoomed .gridview{width:min(718px,130%)!important;min-width:min(718px,130%)!important}
.readGraphFrame .graphTools{margin:8px auto 0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px;font-size:14px;font-weight:700;color:#854413}
.readGraphFrame .graphTools button{border:2px solid #db861c;background:#fff5df;color:#814012;border-radius:12px;padding:7px 14px;font-size:15px;font-weight:800;box-shadow:none;touch-action:manipulation}
.readGraphFrame .graphTools button:active{background:#ffe4a8}
.card.readGraph{touch-action:auto}
/* 変域の不等式の数字・≦・変数をすべて拡大する */
.rangeEquation{font-size:clamp(40px,7vw,60px)!important;font-weight:800!important;line-height:1.45;white-space:nowrap;max-width:100%}
@media(max-width:620px){
 .readGraphFrame{width:100%;margin-top:5px}
 .readGraphFrame .graphTools{font-size:12px;gap:6px}
 .readGraphFrame .graphTools button{font-size:13px;padding:7px 10px}
 .rangeEquation{font-size:clamp(35px,9.1vw,45px)!important;letter-spacing:-.02em}
}

/* グラフ上での2本指ピンチ拡大縮小・1本指の移動 */
.graphZoomFrame{width:min(552px,100%);margin:8px auto 5px;max-width:100%}
.graphZoomFrame .graphViewport{
  position:relative;display:block;width:100%;aspect-ratio:1/1;
  overflow:auto;overscroll-behavior:contain;touch-action:none;
  scrollbar-width:thin;scrollbar-color:#d3a16a #fff6e7;
  border:2px solid #ffb85c;border-radius:16px;background:#fff;
  cursor:grab;
}
.graphZoomFrame .graphViewport:active{cursor:grabbing}
.graphZoomFrame .gridview{
  position:relative!important;display:block!important;flex:none!important;
  aspect-ratio:1/1!important;margin:0!important;
  max-width:none!important;max-height:none!important;
  min-width:0!important;touch-action:none!important;
}
.graphZoomFrame .gridview canvas{
  display:block;width:100%!important;height:100%!important;
  border:0!important;border-radius:0!important;touch-action:none!important;
}
.graphZoomFrame .graphTools{
  display:flex;align-items:center;justify-content:center;
  gap:8px;flex-wrap:wrap;margin:8px 0 0;
  font-size:clamp(12px,2.5vw,15px);font-weight:800;
}
.graphZoomFrame .graphTools button{
  touch-action:manipulation;border:2px solid #d98722;background:#fff3db;
  border-radius:10px;padding:7px 12px;color:#81350b;
  font-size:clamp(12px,2.5vw,15px);font-weight:800;box-shadow:none;
}
.graphZoomFrame .graphZoomStatus{color:#8c461b}
@media(max-width:620px){.graphZoomFrame{width:100%;}}

</style>
</head>

function setupGraphPinchZoom(){
  const frame=element('graphZoomFrame'),viewport=element('graphViewport'),btn=element('graphZoomReset');

  const graph=viewport.querySelector('.gridview');
  const contacts=new Map();
  let zoom=1,base=0,pinchStart=null,panStart=null,hadPinch=false;
  const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
  const center=()=>({x:viewport.clientWidth/2,y:viewport.clientHeight/2});
  const updateStatus=()=>{
    const status=element('graphZoomStatus');

  };
  // 拡大の中心が指の中心からずれないようスクロール位置も補正する

    const ay=anchor?anchor.y:(viewport.scrollTop+fy)/oldSize;

    graph.style.width=newSize+'px';graph.style.height=newSize+'px';
    viewport.scrollLeft=clamp(ax*newSize-fx,0,Math.max(0,newSize-viewport.clientWidth));

  function toLocal(p){const r=viewport.getBoundingClientRect();return {x:p.x-r.left,y:p.y-r.top}}
  function init(){
    base=viewport.clientWidth;
    if(base<1){requestAnimationFrame(init);return}
    const start=Number(frame.dataset.startScale)||1;

      setZoom(pinchStart.scale*distance()/pinchStart.dist,local.x,local.y,pinchStart.anchor);

      viewport.scrollLeft=panStart.left-(e.clientX-panStart.x);
      viewport.scrollTop=panStart.top-(e.clientY-panStart.y);
    }
  });
  function stop(e,canceled=false){
    e.stopPropagation();
    const p=contacts.get(e.pointerId);
    if(!p)return;
    contacts.delete(e.pointerId);
    if(contacts.size<2)pinchStart=null;
    if(contacts.size>0){panStart=null;return}
    const wasPinch=hadPinch;hadPinch=false;panStart=null;
    const dx=e.clientX-p.sx,dy=e.clientY-p.sy;
    if(canceled||wasPinch)return;
    // 拡大せず横スワイプした場合、元どおり次のカードへ。
    if(zoom<=1.02&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3){advance(dx<0?1:-1);return}
    if(Math.abs(dx)>13||Math.abs(dy)>13)return;
    const c=deck[cursor];
    if(revealed&&c.kind==='draw'){
      const max=constructionPointsFor(c).length+1;
      if(constructionStep<max)constructionStep++;
      drawGraph(c,false,true,constructionStep,false);
    }else{revealed=!revealed;constructionStep=0;render()}
  }
  viewport.addEventListener('pointerup',e=>stop(e));
  viewport.addEventListener('pointercancel',e=>stop(e,true));
  viewport.addEventListener('click',e=>e.stopPropagation());
  viewport.addEventListener('wheel',e=>{
    if(!e.ctrlKey)return;
    e.preventDefault();e.stopPropagation();
    const r=viewport.getBoundingClientRect();
    setZoom(zoom*Math.exp(-e.deltaY*.008),e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  if(btn){
    for(const t of ['pointerdown','pointerup','click'])btn.addEventListener(t,e=>e.stopPropagation());
    btn.addEventListener('click',()=>{const c=center();setZoom(1,c.x,c.y);viewport.scrollLeft=0;viewport.scrollTop=0});
  }
}
function forGraph(c,showSegment=false,showConstruction=false,step=0,blankOnly=false){requestAnimationFrame(()=>drawGraph(c,showSegment,showConstruction,step,blankOnly))}
function constructionPointsFor(c){
  if(c.vertical!==null&&c.vertical!==undefined){return [[Number(c.vertical),-2],[Number(c.vertical),0],[Number(c.vertical),2]]}
  const m=fractionNumber(c.m), b=Number(c.b), den=Math.abs(Number(String(c.m).split('/')[1]||1))||1;
  let pts=[[0,b]];
  for(let mult=1;mult<=Math.floor(10/den);mult++){
    const x=den*mult, y=m*x+b;
    if(x<=10 && y<=10 && y>=-10) pts.push([x,y]);
  }
  if(pts.length===1){
    for(let x=1;x<=6;x++){ const y=m*x+b; if(x<=10 && y<=10 && y>=-10) pts.push([x,y]); }
  }
  return pts;
}
function setupGraphTap(c){
  const canvas=element('graph');
  if(canvas)canvas.setAttribute('aria-label',revealed && c.kind==='draw'?'タップして点をひとつずつ取るグラフ用紙':'x軸・y軸ともに±10まで表示したグラフ用紙');
}
function render(){if(!deck.length)return;const c=deck[cursor];element('counter').textContent=`${cursor+1} / ${deck.length}`;element('fill').style.width=((cursor+1)/deck.length*100)+'%';element('catName').textContent=c.cat;element('tag').textContent=`第${cursor+1}問`;element('side').textContent=revealed?'解答・裏':'問題・表';element('flip').textContent=revealed?'🔁 問題にもどる':'🔁 答えをみる'; element('card').classList.toggle('readGraph',c.kind==='read'&&!revealed);
 let body='',needGraph=false,segment=false;
 const linearEq=linear(c);
 if(!revealed){
  if(c.kind==='slope'){body=`<div class="problem">次の一次関数の<br>傾きと切片を答えなさい。</div>${eq(linearEq)}`}
  if(c.kind==='change'){body=`<div class="problem">次の問いに答えなさい。</div><div class="note">${text(c.q)}</div>${c.mode==='fill'?table(c.xs,c.ys):eq('y=2x−3')}`}
  if(c.kind==='draw'){body=`<div class="problem">次の一次関数のグラフをかきなさい。</div>${eq(linearEq)}${graphHtml()}<div class="note">このグラフ用紙に、まず切片を取り、x の右側へ点を順に取ってノートにもかこう。</div>`;needGraph=true}
  if(c.kind==='read'){body=`<div class="problem">次の直線の式を求めなさい。<br><small>グラフ${c.panel}・直線${c.lineNumber}</small></div>${graphHtml('read')}`;needGraph=true}
  if(c.kind==='range'){body=`<div class="problem">次の一次関数の<br><i>y</i> の変域を求めなさい。</div>${eq(linearEq)}<div class="equation smallEquation rangeEquation">${F(c.x0)} ≦ <i>x</i> ≦ ${F(c.x1)}</div>`}
  if(c.kind==='derive'){body=`<div class="problem">次の条件を満たす<br>一次関数の式を求めなさい。</div><div class="note">${text(c.q)}</div>`}
  if(c.kind==='table'){body=`<div class="problem">次の表から一次関数の式を求めなさい。</div>${table(c.xs,c.ys)}`}
  if(c.kind==='canonical'){body=`<div class="problem">次の方程式のグラフをかきなさい。</div><div class="equation smallEquation">${text(c.q)}</div>`}
 }else{
  if(c.kind==='slope'){body=`<div class="answerLabel">答え</div><div class="equation smallEquation">傾き：${F(c.m)}<br>切片：${F(c.b)}</div><div class="step">一次関数 <i>y</i> = <i>ax</i> + <i>b</i> では、<i>x</i> の係数 <i>a</i> が傾き、<i>b</i> が切片です。</div>`}
  if(c.kind==='change'){let ans='',step=''; const m2=fractionNumber(c.m); if(c.mode==='fill'){ans=table(c.xs,c.ansYs); step=`<div class="step">一次関数 <i>y</i>=2<i>x</i>−3 に <i>x</i> の値を代入すると、ア＝−5、イ＝−3、ウ＝3 になります。</div>`;} if(c.mode==='dx'){ans=`<div class="equation smallEquation">x の増加量：${F(c.x1)}−(${F(c.x0)}) = ${F(c.x1-c.x0)}</div>`; step=`<div class="step">増加量は「終わりの値 − はじめの値」で求めます。</div>`;} if(c.mode==='rate'){const dx=c.x1-c.x0, y0=m2*c.x0+Number(c.b), y1=m2*c.x1+Number(c.b), dy=y1-y0; ans=`<div class="equation smallEquation">変化の割合：${F(dy)} ÷ ${F(dx)} = ${F(dy/dx)}</div>`; step=`<div class="step"><i>y</i> の増加量は ${F(y1)}−(${F(y0)}) = ${F(dy)}、<i>x</i> の増加量は ${F(dx)}。したがって変化の割合は ${F(dy/dx)} です。</div>`;} if(c.mode==='dyByDx'){const dy=m2*c.dx; ans=`<div class="equation smallEquation">y の増加量：${F(c.dx)} × ${F(c.m)} = ${F(dy)}</div>`; step=`<div class="step">一次関数 <i>y</i>=<i>ax</i>+<i>b</i> では、変化の割合は傾き ${F(c.m)}。だから <i>x</i> が ${F(c.dx)} 増えると、<i>y</i> は ${F(dy)} 増えます。</div>`;} if(c.mode==='dyRange'){const dx=c.x1-c.x0, y0=m2*c.x0+Number(c.b), y1=m2*c.x1+Number(c.b), dy=y1-y0; ans=`<div class="equation smallEquation">y の増加量：${F(y1)}−(${F(y0)}) = ${F(dy)}</div>`; step=`<div class="step"><i>x</i> が ${F(c.x0)} から ${F(c.x1)} へ増えると、<i>y</i> は ${F(y0)} から ${F(y1)} へ変わるので、増加量は ${F(dy)} です。</div>`;} body=`<div class="answerLabel">答え</div>${ans}${step}`}
  if(c.kind==='draw'){const m=fractionNumber(c.m),b=Number(c.b),den=Math.abs(Number(c.m.split('/')[1]||1)),num=Number(c.m.split('/')[0]);body=`<div class="answerLabel">解答のグラフ</div>${graphHtml()}<div class="step">グラフ用紙をタップするたびに、まず切片 ${point([0,c.b])}、次に x の右側の点を順に打っていきます。<br>${num===0?`同じ高さの点を打ちます。`:`x を ${den} ずつ右へ進み、そのたびに y を ${num>0?`+${Math.abs(num)}`:`−${Math.abs(num)}`} した点を打ちます。`}<br>点がそろったら、最後に直線を引きます。</div>`;needGraph=true}
  if(c.kind==='read'){const den=Number(c.m.split('/')[1]||1),num=Number(c.m.split('/')[0]),y=Number(c.b)+num;body=`<div class="answerLabel">答え</div>${eq(linearEq)}<div class="step">切片は ${F(c.b)}。<br>${num===0?'傾きは0。':`右へ ${den}、上下に ${Math.abs(num)} 移動すると傾きは ${F(c.m)}。`}<br>したがって ${linearEq} です。</div>`}
  if(c.kind==='range'){const y0=fractionNumber(c.m)*c.x0+Number(c.b),y1=fractionNumber(c.m)*c.x1+Number(c.b),small=Math.min(y0,y1),large=Math.max(y0,y1);body=`<div class="answerLabel">答え</div><div class="equation smallEquation rangeEquation">${F(small)} ≦ <i>y</i> ≦ ${F(large)}</div>${graphHtml()}<div class="step"><i>x</i> が ${F(c.x0)} と ${F(c.x1)} のときの <i>y</i> は、それぞれ ${F(y0)} と ${F(y1)}。小さい値から順に並べます。</div>`;needGraph=true;segment=true}
  if(c.kind==='derive'){body=`<div class="answerLabel">答え</div>${eq(linearEq)}<div class="step">まず傾き <i>a</i> を決めて、次に <i>y</i> = <i>ax</i> + <i>b</i> に条件を代入し、切片 <i>b</i> = ${F(c.b)} を求めます。</div>`}
  if(c.kind==='table'){body=`<div class="answerLabel">答え</div>${eq(linearEq)}<div class="step"><i>x</i> と <i>y</i> の増加量から傾き ${F(c.m)} を求め、表の1組を代入すると切片は ${F(c.b)} になります。</div>`}
  if(c.kind==='canonical'){body=`<div class="answerLabel">変形して作図</div><div class="equation smallEquation">${linearEq}</div>${graphHtml()}<div class="step">${c.vertical!==null&&c.vertical!==undefined?`原点 O を確認し、<i>x</i> = ${F(c.vertical)} の位置に点を縦にそろえて、最後に縦の直線を引きます。`:fractionNumber(c.m)===0?`原点 O を確認し、<i>y</i> = ${F(c.b)} の高さで x の右側に点を順に取り、最後に横の直線を引きます。`:'<i>y</i> = <i>ax</i> + <i>b</i> に変形し、原点 O を確認してから切片を取り、x の右側に点を順に取って最後に直線を引きます。'}</div>`;needGraph=true}
 }
 element('content').innerHTML=body;
 if(element('graphZoomFrame'))setupGraphPinchZoom();
 if(c.kind==='draw'&&!revealed){forGraph(c,false,false,0,true);setupGraphTap(c)}
 else if(needGraph){forGraph(c,segment,revealed&&c.kind==='draw',constructionStep,false);setupGraphTap(c)}
}

function drawGraph(c,segment,showConstruction,step=0,blankOnly=false){
 const canvas=element('graph');if(!canvas)return;
 const dpr=Math.min(window.devicePixelRatio||1,3),W=672,H=672;
 canvas.width=W*dpr;canvas.height=H*dpr;
 let ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 let m=fractionNumber(c.m),b=Number(c.b),vertical=c.vertical!==null&&c.vertical!==undefined;
 let needed=10;
 if(segment){const y0=m*c.x0+b,y1=m*c.x1+b;needed=Math.max(needed,Math.abs(c.x0)+2,Math.abs(c.x1)+2,Math.abs(y0)+2,Math.abs(y1)+2)}
 if(vertical)needed=Math.max(needed,Math.abs(c.vertical)+3);
 const r=Math.ceil(needed),p=63,u=(W-2*p)/(2*r),X=x=>W/2+x*u,Y=y=>H/2-y*u;
 ctx.fillStyle='#faf9f6';ctx.fillRect(0,0,W,H);
 for(let i=-r;i<=r;i++){
   const strong=(i===-5||i===5), major=(i%5===0);
   ctx.beginPath();
   ctx.strokeStyle=strong?'#939ca7':major?'#aab2bc':'#c3c9d0';
   ctx.lineWidth=strong?1.8:major?1.35:1.05;
   ctx.moveTo(X(i),Y(-r));ctx.lineTo(X(i),Y(r));
   ctx.moveTo(X(-r),Y(i));ctx.lineTo(X(r),Y(i));
   ctx.stroke();
 }
 ctx.lineWidth=2.7;ctx.strokeStyle='#353535';ctx.beginPath();ctx.moveTo(X(-r),Y(0));ctx.lineTo(X(r),Y(0));ctx.moveTo(X(0),Y(-r));ctx.lineTo(X(0),Y(r));ctx.stroke();
 // axis arrows
 ctx.beginPath();ctx.moveTo(X(r),Y(0));ctx.lineTo(X(r)-8,Y(0)-5);ctx.lineTo(X(r)-8,Y(0)+5);ctx.closePath();ctx.fillStyle='#353535';ctx.fill();
 ctx.beginPath();ctx.moveTo(X(0),Y(r));ctx.lineTo(X(0)-5,Y(r)+8);ctx.lineTo(X(0)+5,Y(r)+8);ctx.closePath();ctx.fill();
 function label(v,x,y,align='center',size=22){ctx.save();ctx.font=`bold ${size}px Georgia,serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='white';ctx.strokeText(v,x,y);ctx.fillStyle='#222';ctx.fillText(v,x,y);ctx.restore();}
 label('0',X(0)+12,Y(0)+29,'center',21.6);
 label('5',X(5),Y(0)+29,'center',36); label('−5',X(-5),Y(0)+29,'center',36);
 label('5',X(0)-22,Y(5),'right',36); label('−5',X(0)-22,Y(-5),'right',36);
 label('10',X(10),Y(0)+29,'center',26); label('−10',X(-10),Y(0)+29,'center',26);
 label('10',X(0)-22,Y(10),'right',26); label('−10',X(0)-22,Y(-10),'right',26);
 label('x',X(r)+16,Y(0)-16,'center',18); label('y',X(0)+16,Y(r)-14,'center',18);
 if(blankOnly) return;
 ctx.save();ctx.beginPath();ctx.rect(X(-r),Y(r),2*r*u,2*r*u);ctx.clip();
 if(showConstruction){
   const pts=constructionPointsFor(c);
   const visible=Math.min(step,pts.length);
   ctx.strokeStyle='#3c9ddd'; ctx.fillStyle='#1777bd'; ctx.lineWidth=3.2;
   for(let i=0;i<visible;i++){
     const [x,y]=pts[i];
     if(i>0){
       const [px,py]=pts[i-1];
       ctx.save();ctx.setLineDash([8,8]);
       ctx.beginPath();ctx.moveTo(X(px),Y(py));ctx.lineTo(X(x),Y(py));ctx.stroke();
       ctx.beginPath();ctx.moveTo(X(x),Y(py));ctx.lineTo(X(x),Y(y));ctx.stroke();
       ctx.restore();
     }
     ctx.beginPath();ctx.arc(X(x),Y(y),7,0,Math.PI*2);ctx.fill();
   }
   if(step>pts.length){
     ctx.beginPath();ctx.strokeStyle='#ee7507';ctx.lineWidth=5.6;ctx.lineCap='round';
     if(vertical){ctx.moveTo(X(Number(c.vertical)),Y(-r));ctx.lineTo(X(Number(c.vertical)),Y(r))}
     else{ctx.moveTo(X(-r),Y(m*(-r)+b));ctx.lineTo(X(r),Y(m*r+b))}
     ctx.stroke();
     // 直線を引いた後も作図した点が分かるよう、青い点を最前面に描き直す。
     for(const [xx,yy] of pts){
       ctx.beginPath();ctx.arc(X(xx),Y(yy),6,0,Math.PI*2);
       ctx.fillStyle='#1777bd';ctx.fill();ctx.lineWidth=1.8;ctx.strokeStyle='white';ctx.stroke();
     }
   }
 }else{
   ctx.beginPath();ctx.strokeStyle='#ee7507';ctx.lineWidth=5.6;ctx.lineCap='round';
   if(vertical){ctx.moveTo(X(Number(c.vertical)),Y(-r));ctx.lineTo(X(Number(c.vertical)),Y(r))}
   else{ctx.moveTo(X(-r),Y(m*(-r)+b));ctx.lineTo(X(r),Y(m*r+b))}
   ctx.stroke();
 }
 if(segment){
   const y0=m*c.x0+b,y1=m*c.x1+b;
   ctx.beginPath();ctx.strokeStyle='#0b87cd';ctx.lineWidth=8;ctx.moveTo(X(c.x0),Y(y0));ctx.lineTo(X(c.x1),Y(y1));ctx.stroke();
   for(const [x,y] of [[c.x0,y0],[c.x1,y1]]){ctx.beginPath();ctx.fillStyle='#005ca7';ctx.arc(X(x),Y(y),7,0,Math.PI*2);ctx.fill()}
 }
 ctx.restore();
}
const advance=d=>{cursor=(cursor+d+deck.length)%deck.length;revealed=false;constructionStep=0;render()};
element('next').onclick=()=>advance(1);element('prev').onclick=()=>advance(-1);
element('flip').onclick=()=>{revealed=!revealed;constructionStep=0;render()};
element('shuffle').onclick=()=>{for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]};cursor=0;revealed=false;constructionStep=0;render()};
catMenu.onchange=()=>{deck=catMenu.value==='all'?ALL.slice():ALL.filter(c=>c.cat===catMenu.value);cursor=0;revealed=false;constructionStep=0;render()};
function cIsReadGraphSwipe(e,dx){return deck[cursor].kind==='read'&&!revealed&&Math.abs(dx)>16&&e.target.closest&&!!e.target.closest('.graphViewport')}
let tx=0,ty=0,startingPointer=null;const card=element('card');
card.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;tx=e.clientX;ty=e.clientY;startingPointer=e.pointerId});
card.addEventListener('pointercancel',()=>{startingPointer=null});
card.addEventListener('pointerup',e=>{
  if(startingPointer!==e.pointerId)return;
  startingPointer=null;
  const dx=e.clientX-tx,dy=e.clientY-ty;
  // 左スワイプは次へ、右スワイプは前へ。グラフの上でも機能する。
  if(cIsReadGraphSwipe(e,dx))return;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3){advance(dx<0?1:-1);return}
  if(Math.abs(dx)>16||Math.abs(dy)>16)return;
  const c=deck[cursor];
  // 作図問題の裏面だけ、グラフをタップするたび点を打ち最後に直線を表示。
  if(revealed&&c.kind==='draw'&&e.target.closest&&e.target.closest('.gridview')){
    const maxStep=constructionPointsFor(c).length+1;
    if(constructionStep<maxStep)constructionStep++;
    drawGraph(c,false,true,constructionStep,false);
    return;
  }
  revealed=!revealed;constructionStep=0;render();
});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')advance(1);if(e.key==='ArrowLeft')advance(-1);if(e.key===' '||e.key==='Enter'){if(e.target.tagName==='SELECT'||e.target.tagName==='BUTTON')return;e.preventDefault();revealed=!revealed;render()}});
window.addEventListener('resize',()=>{if(!element('graph'))return; const c=deck[cursor]; if(c.kind==='draw'&&!revealed) drawGraph(c,false,false,0,true); else drawGraph(c,revealed&&c.kind==='range',revealed&&c.kind==='draw',constructionStep,false)});
render();
</script>
