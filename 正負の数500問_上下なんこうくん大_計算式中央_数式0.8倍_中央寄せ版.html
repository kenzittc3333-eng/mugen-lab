let currentMode = "add";
let index = 0;

function buildControls(){
  const box=document.getElementById("controls");
  Object.entries(modes).forEach(([key,val])=>{
    const b=document.createElement("button");
    b.className="mode";
    b.dataset.mode=key;
    b.textContent=val.label;
    b.onclick=()=>setMode(key);
    box.appendChild(b);
  });
  const s=document.createElement("button");
  s.className="shuffle";
  s.textContent="シャッフル";
  s.onclick=shuffleCurrent;
  box.appendChild(s);
}

function setMode(key){
  currentMode=key;
  index=0;
  render();
}

function render(){
  const data=modes[currentMode];
  const p=data.problems[index];
  document.getElementById("counter").textContent=`${data.label}　問題 ${index+1} / 100`;
  document.getElementById("expr").innerHTML=p.expr.replace(/－/g,'<span class="minusop">－</span>');
  document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===currentMode));
}

function formatSignedAnswer(value){
  const n=Number(value);
  if(n>0)return '<span class="ans-positive">+'+n+'</span>';
  if(n<0)return '<span class="ans-negative">'+n+'</span>';
  return '<span class="ans-zero">0</span>';
}
function showAnswer(){
  const p=modes[currentMode].problems[index];
  const formatted=formatSignedAnswer(p.answer);
  document.getElementById("answer").innerHTML=formatted;
  document.getElementById("original").innerHTML=p.expr.replace(/－/g,'<span class="minusop">－</span>')+' ＝ '+formatted;
  document.getElementById("overlay").classList.add("show");
  sound();
}

function nextProblem(e){
  e.stopPropagation();
  document.getElementById("overlay").classList.remove("show");
  index=(index+1)%100;
  render();
}

function shuffleCurrent(){
  const a=modes[currentMode].problems;
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  index=0;
  render();
}

function sound(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    const c=new C(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.frequency.setValueAtTime(660,c.currentTime);
    o.frequency.setValueAtTime(880,c.currentTime+.12);
    g.gain.setValueAtTime(.001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);
    o.start();o.stop(c.currentTime+.32);
  }catch(e){}
}
