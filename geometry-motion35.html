<style>
:root{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;color:#653416;background:#fff2dd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 7% 5%,#fff4ab,transparent 28%),linear-gradient(150deg,#fff8eb,#ffd8a5);min-height:100dvh}
button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,.flash:focus-visible{outline:3px solid #2176d3;outline-offset:3px}[hidden]{display:none!important}
.wrap{max-width:850px;margin:auto;padding:12px 14px 28px}
header{border:3px solid #ffb764;background:linear-gradient(145deg,#fffdf7,#ffeed0);border-radius:24px;text-align:center;padding:14px 12px;box-shadow:0 7px #ec9d46,0 14px 28px #a85c1622}
.brand{font-weight:1000;font-size:clamp(12px,3vw,20px);white-space:nowrap;letter-spacing:.02em;color:transparent;background:linear-gradient(90deg,#f3464a,#ee8d27,#e8b21c,#30a95c,#2384d4,#9352bd);background-clip:text;-webkit-background-clip:text}
h1{color:#ea671e;font-size:clamp(28px,7vw,48px);line-height:1.2;margin:9px 0 3px;text-shadow:2px 3px white;font-weight:1000}.sub{color:#a95c29;font-weight:900;font-size:clamp(12px,3vw,18px)}
.mascots{display:flex;justify-content:space-between;align-items:end;margin:12px auto 0;max-width:550px;gap:8px}
.mascot{width:min(29vw,155px);min-width:82px;font-size:clamp(10px,2.6vw,14px);font-weight:900;color:#95451a}
.portrait{border:0;border-radius:0;background:transparent;width:100%;aspect-ratio:0.82;display:grid;place-items:center;overflow:visible}
.portrait.pink{background:transparent}.portrait img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 4px #6c461d45)}.portrait .placeholder{font-size:clamp(29px,6vw,54px);color:white;text-shadow:2px 2px #b75a2b}.cheer{font-size:clamp(16px,4vw,30px);font-weight:1000;color:#ef8022;align-self:center}
.badges,.controls,.extra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.badges{margin:17px 0 12px}.badge{padding:9px 13px;background:white;border:1px solid #f5c596;border-radius:100px;font-weight:900;color:#a44f21}
.controls{margin:13px 0}.ctrl{min-height:44px;border:2px solid #f6c18e;border-radius:12px;background:white;color:#84451e;padding:9px 12px;font-weight:900}.ctrl.on{background:#f16a25;border-color:#e95f1e;color:white}
.progress{height:10px;border-radius:99px;background:#fff;border:1px solid #f6ca8f;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#ffc52e,#f36d20,#fd5783);transition:width .2s}
.flash{user-select:none;touch-action:pan-y;margin-top:12px;min-height:clamp(340px,53vh,500px);padding:clamp(18px,4vw,34px);border:5px solid #fa9337;background:linear-gradient(150deg,#fff,#fff5e8);border-radius:27px;box-shadow:0 11px #e8ac63,0 17px 28px #a85c1629;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:space-between}
.flash.answer-mode{background:linear-gradient(150deg,#fffefa,#ffe6cd)}.rank{background:#ffead0;padding:8px 17px;border-radius:30px;font-weight:1000;color:#a84d1d;font-size:clamp(16px,3vw,21px)}.rank b{color:#e85e1b;font-size:1.25em}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%}.label{font-size:clamp(16px,3vw,22px);color:#be6b38;font-weight:1000}.question{font-size:clamp(23px,5.1vw,36px);font-weight:1000;line-height:1.55;overflow-wrap:anywhere}.answer{font-size:clamp(32px,7vw,56px);font-weight:1000;color:#e4561a;line-height:1.4;overflow-wrap:anywhere}.note{color:#944e1b;background:#fff0d4;border-left:5px solid #ea922f;text-align:left;padding:10px;border-radius:8px;font-size:13px;line-height:1.6}.hint{font-size:13px;color:#986c43;font-weight:800}
.nav{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;margin-top:20px}.primary{border:0;border-radius:16px;background:linear-gradient(180deg,#ffa139,#ed6c24);color:white;min-height:55px;font-size:clamp(16px,3.7vw,20px);font-weight:1000;box-shadow:0 5px #b8521a;padding:10px 5px}.primary:active{transform:translateY(3px);box-shadow:0 2px #b8521a}
.extra{margin-top:17px}.secondary{border:2px solid #f7c58f;border-radius:13px;background:white;color:#87461b;padding:10px 13px;font-weight:900;min-height:44px}.secondary.marked{border-color:#75bb82;background:#e7ffe9;color:#287a46}
details{margin-top:22px;background:#fffaf3;border:2px solid #ffd0a0;border-radius:17px;padding:13px 15px}summary{cursor:pointer;color:#9a4c1c;font-weight:1000}details p{font-size:13px;line-height:1.6}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:10px}.uploads label{background:white;border:1px solid #f4c291;border-radius:10px;padding:9px;font-size:13px;font-weight:900}.uploads input{display:block;width:100%;font-size:12px;margin-top:6px}
.save{border:0;border-radius:12px;background:#26865a;color:white;font-weight:1000;padding:12px 16px;margin-top:12px}
footer{margin-top:22px;text-align:center;color:#8f613e;font-size:12px;line-height:1.8}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#62371f;color:#fff;border-radius:24px;padding:11px 17px;font-weight:900;text-align:center;max-width:90%;z-index:5}
@media(max-width:480px){.wrap{padding:9px 10px 26px}.uploads{grid-template-columns:1fr}.primary{font-size:16px}.flash{min-height:370px}}
.question{color:#171717;white-space:pre-line}.answer{color:#d51d32}.reference{position:fixed;top:0;left:0;right:0;z-index:10;background:#fffaf0;border-bottom:3px solid #f39332;padding:5px max(8px,calc((100vw - 820px)/2));box-shadow:0 3px 12px #65341622;height:166px}.refhead{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:#bd4f13;height:28px}.zoom{background:white;border:1px solid #efaf77;border-radius:8px;font-size:12px;padding:4px 8px;color:#7b421f}table{width:100%;border-collapse:collapse;font-size:clamp(11px,2.8vw,15px);background:#fff}th,td{border:1px solid #efc396;padding:5px 3px;text-align:center}th{background:#fff0be}.wrap{padding-top:180px}.flash{min-height:300px}dialog{max-width:980px;width:96vw;border:2px solid #f39332;border-radius:16px;padding:12px}dialog::backdrop{background:#0009}dialog form{text-align:right}@media(max-width:480px){.wrap{padding-top:180px}.flash{min-height:290px}} .wrap{padding-top:12px}.question{font-size:clamp(44px,12vw,76px)}.answer{font-size:clamp(38px,10vw,64px)}@media(max-width:480px){.wrap{padding-top:9px}} .question{font-size:clamp(36px,10vw,72px);font-family:Arial,sans-serif;overflow-wrap:anywhere}.answer{font-size:clamp(25px,6vw,44px)} .question.japanese{font-family:inherit;font-size:clamp(25px,6vw,44px)}.answer.english{font-family:Arial,sans-serif;font-size:clamp(36px,10vw,72px)} .kana{font-size:clamp(20px,5vw,30px);color:#87461b;line-height:1.6;font-weight:800;overflow-wrap:anywhere}.answer{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:clamp(26px,6.5vw,44px)} 
.question,.answer{font-family:inherit;font-size:clamp(22px,5.4vw,36px);line-height:1.5}
.answer{font-size:clamp(25px,6vw,40px);text-wrap:balance}
.figure{width:min(100%,550px);height:auto;border:1px solid #edcda8;border-radius:14px;background:#fff;display:block}
#construction{width:min(100%,600px);cursor:default}
#step{margin:0 0 8px;min-height:2.8em;font-weight:800;color:#85451e}
#board{display:block;width:100%;background:white;border:1px solid #edcda8;border-radius:14px;cursor:crosshair;touch-action:pan-y}
#board:focus-visible{outline:3px solid #2176d3}
#board .gridCursor{visibility:hidden}
#board:focus-visible .gridCursor{visibility:visible}
.construction-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.center{padding:12px 0}.flash{cursor:pointer}.primary:disabled,.secondary:disabled,.ctrl:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:12px}
.grid button{padding:8px 4px;border:1px solid #eab77e;border-radius:10px;background:white;color:#84451e;font-weight:900;min-height:44px}
.grid button[aria-current=true]{background:#f16a25;color:#fff;border-color:#e95f1e}
.grid button.review{border:2px solid #4e9764}
@media(max-width:480px){.flash{padding:14px 10px}.center{gap:11px}.rank{padding:6px 10px}}

<body>
<main class="wrap">
<header>
  <div class="brand">総合教育研究所　無限の可能性</div>
  <h1>中1数学 直線と角・図形の移動</h1>
  <div class="sub">全35問 ／ 直線と角・平行移動・回転移動・対称移動</div>
  <div class="mascots">
    <div class="mascot"><div class="portrait"><span class="placeholder" id="nankoBlank">なん</span><img id="nankoImg" alt="なんこうくん" hidden></div>なんこうくん</div>
    <div class="cheer">いっしょに<br>がんばろう！<br>∞</div>
    <div class="mascot"><div class="portrait pink"><span class="placeholder" id="chappyBlank">ちゃ</span><img id="chappyImg" alt="むげんチャッピー" hidden></div>むげんチャッピー</div>
  </div>
</header>
<div class="badges"><span class="badge">全35問</span><span class="badge" id="counter">1 / 35</span><span class="badge" id="markedCount">復習 0問</span></div>

<div class="controls">
  <select id="filter" class="ctrl" aria-label="単元を選択"><option value="all">すべての単元</option><option>直線と角</option><option>平行移動</option><option>回転移動</option><option>対称移動</option><option value="construction">作図だけ（5問）</option><option value="review">復習マークのみ</option></select>
  <button id="shuffle" class="ctrl" type="button" aria-pressed="false">⇄ シャッフル</button>
  <button id="voice" class="ctrl" type="button" aria-pressed="false">🔈 音声OFF</button>
  <select id="rate" class="ctrl" aria-label="読み上げ速度"><option value=".75">ゆっくり</option><option value=".95" selected>ふつう</option><option value="1.2">はやい</option></select>
</div>
<div class="controls"><button id="startConstruction" class="ctrl on" type="button">作図を始める（第31問）</button></div><div class="progress"><div id="bar"></div></div>
<section id="flash" class="flash" role="button" tabindex="0" aria-label="問題と解答を切り替える">
  <div class="rank" id="rank"><b>1</b> 番　直線と角</div>
  <div class="center"><div class="label" id="side">もんだい</div><div class="question" id="question"></div><div class="answer" id="answer" hidden></div><img id="figure" class="figure" alt=""><section id="construction" hidden aria-label="作図シミュレーション"><p id="step" role="status"></p><svg id="board" viewBox="0 0 408 288" tabindex="0" aria-label="方眼。矢印キーで交点を移動し、Enterで点を置く"></svg><div class="construction-actions"><button id="undoPoint" class="secondary" type="button">1点戻す</button><button id="clearPoints" class="secondary" type="button">作図をやり直す</button></div></section><div class="note" id="note" hidden></div></div>
  <div class="hint" id="hint">カードをタップして答えを見る</div>
</section>
<nav class="nav"><button id="prev" class="primary">← まえ</button><button id="flip" class="primary">答えを見る</button><button id="next" class="primary">つぎ →</button></nav>
<div class="extra"><button id="repeat" class="secondary">🔉 読み上げ</button><button id="mark" class="secondary">☆ 復習する</button><button id="restart" class="secondary">↺ 最初から</button></div>
<details><summary>番号から選ぶ</summary><div id="grid" class="grid"></div></details><details><summary>🎨 なんこうくんの画像をカスタマイズ</summary><p>画像を選ぶと、この画面のなんこうくんを変更できます。</p><div class="uploads"><label>なんこうくん<input type="file" accept="image/*" id="nankoFile"></label></div></details>
<footer><b>総合教育研究所　無限の可能性</b><div>左スワイプ：次問 ／ 右スワイプ：前問 ／ タップ：解答</div></footer>
</main><div id="toast" class="toast" role="status" hidden></div>

 "perp", "question": "直線ABと直線CDの関係を、記号で表そう。", "answer": "AB ⊥ CD", "note": "「AB垂直CD」と読みます。"}, {"number": 12, "unit": "直線と角", "figure": "perp", "question": "直線ABに垂直な直線CDを、ABの何という？", "answer": "垂線", "note": "ABもCDの垂線です。"}, {"number": 13, "unit": "直線と角", "figure": "segment", "question": "2点A、Bの間の距離とは、何の長さ？", "answer": "線分ABの長さ", "note": "2点をまっすぐ結んで測ります。"}, {"number": 14, "unit": "直線と角", "figure": "mid", "question": "線分AB上で、AとBからの距離が等しい点Mを何という？", "answer": "中点", "note": "Mは線分ABを2等分しています。"}, {"number": 15, "unit": "直線と角", "figure": "mid", "question": "Mが線分ABの中点のとき、AMとBMの関係は？", "answer": "AM = BM", "note": "同じ印が付いた部分の長さは等しくなります。"}, {"number": 16, "unit": "直線と角", "figure": "dist", "question": "点Pと直線ℓの距離は、どの線分の長さ？", "answer": "線分PHの長さ", "note": "Pからℓに下ろした垂線とℓが交わる点がHです。"}, {"number": 17, "unit": "平行移動", "figure": "trans", "question": "図形のすべての点を、同じ向きに同じ距離だけずらす移動は？", "answer": "平行移動", "note": "3本の矢印は、どれも同じ向きと長さです。"}, {"number": 18, "unit": "平行移動", "figure": "trans", "question": "移動前のAと、移動後にAが重なる点A′を何という？", "answer": "対応する点", "note": "BとB′、CとC′もそれぞれ対応します。"}, {"number": 19, "unit": "平行移動", "figure": "trans", "question": "AA′、BB′、CC′の長さには、どんな関係がある？", "answer": "AA′ = BB′ = CC′", "note": "どの点も同じ距離だけ移動します。"}, {"number": 20, "unit": "平行移動", "figure": "trans", "question": "AA′、BB′、CC′の向きの関係を、平行の記号で表そう。", "answer": "AA′ ∥ BB′ ∥ CC′", "note": "対応する点を結ぶ線分は互いに平行です。"}, {"number": 21, "unit": "回転移動", "figure": "rot", "question": "点Oのまわりに図形を一定の角度だけ回す移動は？", "answer": "回転移動", "note": "図ではOを中心に反時計回りに60°回しています。"}, {"number": 22, "unit": "回転移動", "figure": "rot", "question": "図形を回すとき、動かない点Oを何という？", "answer": "回転の中心", "note": "各頂点はOを中心とする円弧に沿って動きます。"}, {"number": 23, "unit": "回転移動", "figure": "rot", "question": "OA、OB、OCと、それぞれに等しい長さを答えよう。", "answer": "OA = OA′ ／ OB = OB′ ／ OC = OC′", "note": "回転しても、各頂点と回転の中心の距離は変わりません。"}, {"number": 24, "unit": "回転移動", "figure": "rot", "question": "図で∠COC′が60°のとき、∠AOA′と∠BOB′はそれぞれ何度？", "answer": "どちらも60°", "note": "すべての点を同じ向きに同じ角度だけ回します。"}, {"number": 25, "unit": "回転移動", "figure": "half", "question": "点Oを中心に180°回す移動を、何という？", "answer": "点対称移動", "note": "Oは対応する点を結ぶ線分の中点になります。"}, {"number": 26, "unit": "対称移動", "figure": "ref", "question": "直線ℓを折り目として、図形を折り返すような移動は？", "answer": "対称移動", "note": "左右の三角形は、直線ℓで折ると重なります。"}, {"number": 27, "unit": "対称移動", "figure": "ref", "question": "対称移動の折り目になる直線ℓを何という？", "answer": "対称の軸（対称軸）", "note": "軸から対応する点までの距離は、両側で等しくなります。"}, {"number": 28, "unit": "対称移動", "figure": "ref", "question": "線分AA′、BB′、CC′は、直線ℓとそれぞれ何度で交わる？", "answer": "90°（垂直）", "note": "AA′ ⊥ ℓ、BB′ ⊥ ℓ、CC′ ⊥ ℓです。"}, {"number": 29, "unit": "対称移動", "figure": "ref", "question": "AL、BM、CNと、それぞれに等しい長さを答えよう。", "answer": "AL = A′L ／ BM = B′M ／ CN = C′N", "note": "L、M、Nは、それぞれ対応する点を結ぶ線分の中点です。"}, {"number": 30, "unit": "対称移動", "figure": "ref", "question": "直線ℓは、線分AA′をどのように分けている？", "answer": "垂直に2等分している", "note": "対称の軸は、対応する点を結ぶ線分の垂直二等分線です。"}, {"number": 31, "unit": "平行移動", "question": "矢印と同じ向き・長さだけ△ABCを移動し、△DEFを作図しよう。", "answer": "完成図", "note": "A、B、Cからそれぞれ右に6マス、上に1マス進みます。", "construction": {"vertices": [[3, 4], [1, 7], [6, 9]], "targets": [[9, 3], [7, 6], [12, 8]], "names": "DEF", "arrow": [[1, 3], [7, 2]]}}, {"number": 32, "unit": "平行移動", "question": "Cが図のC′に重なるように△ABCを平行移動しよう。", "answer": "完成図", "note": "CからC′までは右に4マス、上に2マス。AとBも同じだけ移動します。", "construction": {"vertices": [[4, 4], [1, 6], [5, 8]], "targets": [[8, 2], [5, 4], [9, 6]], "given": [9, 6]}}, {"number": 33, "unit": "対称移動", "question": "直線ℓを折り目として△ABCを折り返し、△DEFを作図しよう。", "answer": "完成図", "note": "各頂点から軸ℓまでのマスを数え、同じ高さで軸の反対側に同じだけ進みます。", "construction": {"vertices": [[5, 2], [3, 6], [6, 8]], "targets": [[9, 2], [11, 6], [8, 8]], "names": "DEF", "axis": 7}}, {"number": 34, "unit": "回転移動", "question": "Oを中心に△ABCを反時計回りに90°回転させよう。", "answer": "完成図", "note": "Oから右に何マス、上に何マスかを数えます。90°反時計回りでは、右は上へ、上は左へ向きが変わります。", "construction": {"vertices": [[13, 3], [10, 8], [14, 7]], "targets": [[2, 2], [7, 5], [6, 1]], "center": [7, 8]}}, {"number": 35, "unit": "回転移動", "question": "Oを中心に△ABCを180°回転させよう。", " function drawConstruction(card, solution) {
  const section = $('construction');
  section.hidden = !card?.construction;
  if (section.hidden) return;
  const {vertices, targets, center, axis, arrow, given, names} = card.construction;
  const labels = names ? [...names] : ['A′','B′','C′'];
  const ink = '#263346';
  const purple = '#693aa5';
  const line = (a,b,stroke,width=1,extra='') => {
    const [x1,y1]=screen(a), [x2,y2]=screen(b);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${width}" ${extra}/>`;
  };
  const dot = (p,label,color,dx,dy) => {
    const [x,y]=screen(p);
    return `<circle cx="${x}" cy="${y}" r="4" fill="${color}"/><text x="${x+dx}" y="${y+dy}" fill="${color}" paint-order="stroke" stroke="#fff" stroke-width="3">${label}</text>`;
  };
  const outline = (points,color,fill) => {
    const list=points.map(p=>screen(p).join(',')).join(' ');
    return points.length===3
      ? `<polygon points="${list}" fill="${fill}" stroke="${color}" stroke-width="3"/>`
      : `<polyline points="${list}" fill="none" stroke="${color}" stroke-width="3"/>`;
  };
  let svg='<defs><marker id="moveArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a84816"/></marker></defs>';
  for(let x=0;x<=15;x++) svg+=line([x,0],[x,10],'#aebec9');
  for(let y=0;y<=10;y++) svg+=line([0,y],[15,y],'#aebec9');
  svg+=outline(vertices,ink,'#ffe3c288');
  if(axis!==undefined) {
    svg+=line([axis,0],[axis,10],'#a84816',3);
    svg+=dot([axis,0],'ℓ','#a84816',7,-7);
  }
  if(center) svg+=dot(center,'O','#a84816',7,-8);
  if(arrow) svg+=line(...arrow,'#a84816',3,'marker-end="url(#moveArrow)"');
  const points=solution ? targets : placed;
  if(solution) targets.forEach((p,i)=> {
    const a=vertices[i];
    const extra='stroke-dasharray="4 4"';
    if (center && !samePoint(p, [2*center[0]-a[0],2*center[1]-a[1]])) {
      svg+=line(a,center,purple,1.5,extra)+line(center,p,purple,1.5,extra);
    } else if (!center && axis===undefined) {
      const elbow=[p[0],a[1]];
      svg+=line(a,elbow,purple,1.5,extra)+line(elbow,p,purple,1.5,extra);
    } else svg+=line(a,p,purple,1.5,extra);
  });
  if(given && points.length<3) svg+=dot(given,'C′','#a84816',7,-8);
  svg+=outline(points,purple,'#b48be94d');
  vertices.forEach((p,i)=>{svg+=dot(p,'ABC'[i],ink,i===1?-15:7,i===2?17:-8);});
  points.forEach((p,i)=>{svg+=dot(p,labels[i],purple,i===1?-17:7,i===2?17:-8);});
  if (!solution && feedback && missedPoint) {
    const [x,y]=screen(missedPoint);
    svg+=`<path d="M${x-5},${y-5}l10,10m0,-10l-10,10" stroke="#b32132" stroke-width="3"/>`;
  }
  const [cx,cy]=screen(gridCursor);
  if (!solution) svg+=`<circle class="gridCursor" cx="${cx}" cy="${cy}" r="8" fill="none" stroke="#087b93" stroke-width="2"/>`;
  $('board').innerHTML=`<g font-family="system-ui,sans-serif" font-size="15" font-weight="750">${svg}</g>`;
  const i=placed.length;
  $('step').textContent=solution ? 'お手本の三角形' : i===3 ? '正解！ 3点がつながって三角形が完成しました。' :
    (feedback ? feedback+' ' : '')+`${i+1} / 3　${'ABC'[i]}に対応する点 ${labels[i]} を選ぼう。`;
  $('undoPoint').hidden=$('clearPoints').hidden=solution;
  $('undoPoint').disabled=$('clearPoints').disabled=i===0;
}

function placePoint(point) {
  const card=order[index];
  if (revealed || !card?.construction || placed.length===3) return;
  if(samePoint(point,card.construction.targets[placed.length])) {
    placed.push(point);
    feedback='';
  } else {
    missedPoint=point;
    feedback='×の位置を確認して、別の交点を選ぼう。';
  }
  drawConstruction(card,false);
}

'use strict';
const $ = id => document.getElementById(id);

  tri: '頂点A、B、Cの三角形',

};
const storageKey = 'mugen-geometry-motion-review';

  const source = window.MUGEN_IMAGES?.[name];

    $(name+'Img').src = source;
    $(name+'Img').hidden = false;
    $(name+'Blank').hidden = true;
  }
}
$('nankoFile').onchange = event => {
  const image = event.target.files[0];
  if (!image) return;
  const reader = new FileReader();
  reader.onload = () => {
    $('nankoImg').src = reader.result;
    $('nankoImg').hidden = false;
    $('nankoBlank').hidden = true;
  };
  reader.readAsDataURL(image);
};

function stop() {
  if (canSpeak) speechSynthesis.cancel();
}
function speak() {
  const card = order[index];
  if (!canSpeak || !card) return;
  stop();
  const utterance = new SpeechSynthesisUtterance(revealed ? card.answer+'。'+card.note : card.question);
  utterance.lang = 'ja-JP';
  utterance.rate = Number($('rate').value);
  speechSynthesis.speak(utterance);
}
function show() {
  const card = order[index];
  $('rank').textContent = card ? card.number+' 番　'+card.unit : '復習';
  $('side').textContent = revealed ? '答え' : 'もんだい';
  $('counter').textContent = card ? (index+1)+' / '+order.length : '0 / 0';
  $('markedCount').textContent = '復習 '+marks.size+'問';
  $('bar').style.width = (card ? 100*(index+1)/order.length : 0)+'%';
  $('question').textContent = card?.question ?? '復習マークをつけた問題はありません。';
  $('question').hidden = revealed;
  $('answer').textContent = card?.answer ?? '';
  $('note').textContent = card?.note ?? '';
  $('answer').hidden = $('note').hidden = !revealed;
  const figure = $('figure');
  figure.hidden = !card || Boolean(card.construction);
  if (!figure.hidden) {
    if (figure.getAttribute('src') !== figures[card.figure]) figure.src = figures[card.figure];

  $('flash').setAttribute('role',card?.construction ? 'group' : 'button');

    button.onclick = () => { index = position; enterQuestion(); };
    return button;
  });

}
function enterQuestion() {

  feedback='';

  revealed = false;

}
function selectCards() {

  shuffled = false;
  index = 0;
}

  if (!order.length) return;
  stop();
  revealed = !revealed;

function move(delta) {
  const next = index+delta;
  if (next < 0 || next >= order.length) return;
  index = next;
  enterQuestion();
}
$('filter').onchange = () => { selectCards(); enterQuestion(); };
$('restart').onclick = () => { selectCards(); enterQuestion(); };
$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);
$('flip').onclick = flip;
$('repeat').onclick = speak;
$('voice').disabled = $('rate').disabled = !canSpeak;
$('voice').onclick = () => {
  auto = !auto;
  $('voice').textContent = auto ? '🔊 音声ON' : '🔈 音声OFF';
  $('voice').classList.toggle('on',auto);
  $('voice').setAttribute('aria-pressed',String(auto));
  if (auto) speak(); else stop();
};
$('mark').onclick = () => {
  const card = order[index];
  if (!card) return;
  if (marks.has(card.number)) marks.delete(card.number); else marks.add(card.number);
  try { localStorage.setItem(storageKey, JSON.stringify([...marks])); } catch {}
  if ($('filter').value === 'review') {
    order.splice(index,1);
    index = Math.max(0,Math.min(index,order.length-1));
    enterQuestion();
  } else show();
};
$('shuffle').onclick = () => {
  if (shuffled) selectCards();
  else {
    for (let i=order.length-1;i>0;i--) {
      const j=Math.floor(Math.random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
    shuffled=true;
    index=0;
  }
  enterQuestion();
};
const flash = $('flash');
let start;
let suppressClick = false;
flash.addEventListener('pointerdown', e => {
  if (!e.isPrimary || e.button !== 0 || e.target.closest('#construction')) return;
  suppressClick = false;
  start = {x:e.clientX,y:e.clientY,id:e.pointerId};
});
flash.addEventListener('pointercancel', () => { start = undefined; });
flash.addEventListener('pointerup', e => {
  if (start?.id !== e.pointerId) return;
  const dx=e.clientX-start.x,dy=e.clientY-start.y;
  start=undefined;
  if (Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.4) {
    suppressClick=true;
    move(dx<0 ? 1 : -1);
  }
});
flash.onclick = () => { if (!suppressClick && !order[index]?.construction) flip(); suppressClick=false; };
flash.onkeydown = e => {
  if (!order[index]?.construction && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); flip(); }
};
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, button, summary, #board')) return;
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'ArrowRight') move(1);
});
$('startConstruction').onclick=()=>{
  $('filter').value='construction';
  selectCards();
  enterQuestion();
  $('flash').scrollIntoView({block:'start'});
};
const board=$('board');
board.onclick=e=>{
  const bounds=board.getBoundingClientRect();
  if (!bounds.width || !bounds.height) return;
  const point=[
    (e.clientX-bounds.left-board.clientLeft)*408/board.clientWidth,
    (e.clientY-bounds.top-board.clientTop)*288/board.clientHeight
  ].map(n=>Math.round((n-inset)/cell));
  if(point[0]>=0 && point[0]<=15 && point[1]>=0 && point[1]<=10) placePoint(point);
};
board.onkeydown=e=>{
  const delta={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if (!delta && e.key!=='Enter' && e.key!==' ') return;
  e.preventDefault();
  e.stopPropagation();
  if (delta) {
    gridCursor=gridCursor.map((n,i)=>Math.max(0,Math.min(i===0?15:10,n+delta[i])));
    drawConstruction(order[index],revealed);
  } else placePoint(gridCursor);
};
$('undoPoint').onclick=()=>{
  placed.pop();
  feedback='';
  drawConstruction(order[index],false);
};
$('clearPoints').onclick=()=>{
  placed=[];
  feedback='';
  drawConstruction(order[index],false);
};
show();
</script></body></html>
