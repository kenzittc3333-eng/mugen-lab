<style>
/* Mathematical typography: large italic variables and carefully stacked fractions. */
.problem,.answer{width:100%;max-width:100%;white-space:normal;overflow-wrap:normal;word-break:normal;text-align:center}
.problem{font-size:clamp(24px,3vw,32px);font-weight:650;line-height:1.9}
.answer{font-size:clamp(30px,4vw,46px);line-height:1.8}
.math-group{display:inline-flex;align-items:center;white-space:nowrap;vertical-align:middle;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:2em;font-weight:500;line-height:1.35;max-width:100%;font-variant-numeric:lining-nums}
.math-letter{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:italic;font-weight:400}
.math-group sup{font-size:.62em;line-height:0;position:relative;top:-.38em}
.stack-frac{display:inline-grid;grid-template-rows:auto auto;grid-template-columns:max-content;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .06em;font-weight:500}
.fraction-num{display:block;border-bottom:1.6px solid currentColor;padding:0 .12em .07em}
.fraction-den{display:block;padding:.07em .12em 0}
.system-math{display:inline-flex;align-items:stretch;gap:0.12em;max-width:100%;vertical-align:middle;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.65em;font-weight:400;line-height:1.2}
.system-lines{display:flex;flex-direction:column;align-items:flex-start;gap:.18em;min-width:0}
.system-line{white-space:nowrap}
.system-line .math-group{font-size:1em}
.system-brace{white-space:pre;font-size:1.1em;line-height:1.17;font-family:serif;align-self:center}
@media(max-width:620px){.problem{font-size:23px;line-height:1.8}.answer{font-size:30px}.face{padding:25px 12px;min-height:350px}.math-group{font-size:2em}.system-math{font-size:1.35em}}

:root{--orange:#f97316;--dark:#78350f;--cream:#fff7ed;--line:#fed7aa;--ink:#292524}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7ed,#ffedd5);font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink)}header{max-width:980px;margin:auto;text-align:center;padding:26px 16px 10px}h1{font-size:clamp(24px,5vw,36px);line-height:1.3;margin:5px 0;color:var(--dark)}.rainbow{font-size:13px;font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,#ea580c,#ca8a04,#16a34a,#2563eb,#9333ea);color:transparent;background-clip:text}.tag{font-size:13px;color:#78716c;margin-top:7px}.wrap{max-width:980px;margin:auto;padding:14px} .toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}select,input{width:100%;min-height:45px;border:1px solid #fdba74;border-radius:12px;background:white;padding:8px;font-size:15px;color:#431407}select:focus,input:focus{outline:2px solid #fb923c}.panel{background:white;border:2px solid #fdba74;border-radius:20px;box-shadow:0 13px 30px rgba(120,53,15,.1);overflow:hidden}.panelHead{background:#fff7ed;border-bottom:1px solid var(--line);padding:13px 20px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.num{font-weight:900;color:#9a3412}.cat{font-size:13px;color:#57534e}.face{min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 24px;cursor:pointer;gap:16px;touch-action:pan-y}.problem{font-size:clamp(19px,3.8vw,29px);font-weight:700;line-height:1.85;white-space:pre-wrap;text-align:center;overflow-wrap:anywhere}.illustration svg{max-width:330px;width:100%;max-height:200px}.reveal{font-size:13px;color:#a16207}.answer{color:#dc2626;font-size:clamp(28px,5vw,44px);font-weight:900;text-align:center;line-height:1.5;white-space:pre-wrap}.explain{font-size:15px;color:#57534e;line-height:1.7;text-align:center}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 8px}button{border:0;border-radius:13px;background:#ea580c;color:white;font-size:15px;font-weight:800;padding:13px 8px;cursor:pointer}button.secondary{background:#ffedd5;color:#9a3412}button:disabled{opacity:.4;cursor:default}.subactions{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:10px}.subactions button{font-size:13px;padding:10px 14px;background:#fff;color:#9a3412;border:1px solid #fdba74}.progress{text-align:center;color:#57534e;font-size:14px;margin-top:16px}.privacy{border-top:1px solid #fdba74;margin-top:22px;padding:18px;font-size:13px;color:#78716c;text-align:center} @media(max-width:620px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:span 2}.face{min-height:360px;padding:24px 14px}.actions button{font-size:14px}}

/* Mascot banner only: never changes the equations, flashcard contents, or controls. */
.mugen-mascot-banner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3.1fr) minmax(0,1fr);align-items:center;gap:14px;margin:10px auto 2px;max-width:900px}
.mugen-mascot{margin:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mugen-mascot img{display:block;width:100%;max-width:142px;height:158px;object-fit:contain;object-position:center bottom}
.mugen-mascot figcaption{color:#9a3412;font-size:clamp(10px,1.8vw,13px);line-height:1.3;font-weight:800;white-space:nowrap}
.mugen-mascot-message{min-width:0}.mugen-mascot-message h1{overflow-wrap:anywhere}
.mugen-mascot-message .tag{line-height:1.55}
@media(max-width:620px){.mugen-mascot-banner{grid-template-columns:minmax(0,1fr) minmax(0,2.7fr) minmax(0,1fr);gap:6px;margin-top:8px}.mugen-mascot img{height:clamp(94px,25vw,137px)}.mugen-mascot-message h1{font-size:clamp(17px,4.6vw,25px)}.mugen-mascot-message .tag{font-size:10px;line-height:1.35;margin:5px 0 0}.mugen-mascot figcaption{font-size:10px;letter-spacing:-.05em}}
@media(max-width:350px){.mugen-mascot-banner{gap:3px;grid-template-columns:minmax(0,1fr) minmax(0,2.7fr) minmax(0,1fr)}.mugen-mascot-message h1{font-size:16px}.mugen-mascot figcaption{font-size:9px}}

/* Square roots rendered with native MathML so the vinculum is continuous and properly aligned. */
math.mugen-sqrt{font-family:"STIX Math","Cambria Math","DejaVu Math TeX Gyre",serif;font-size:1em;vertical-align:-0.05em;margin:0 .015em;white-space:nowrap}
math.mugen-sqrt msqrt{math-style:normal}

const MUGEN_MATHML='http://www.w3.org/1998/Math/MathML';
function mugenAppendMathText(parent,str){

  while(pos<str.length){
    if(str[pos]!=='√'){
      let next=str.indexOf('√',pos);
      if(next<0)next=str.length;

    if(str[after]==='('){
      let depth=0,end=after;
      for(;end<str.length;end++){
        if(str[end]==='(')depth++;

      }
      if(depth===0){radicand=str.slice(after+1,end-1);after=end;}
    }else{
      const match=str.slice(after).match(/^[0-9A-Za-z]+/);
      if(match){radicand=match[0];after+=radicand.length;}

    const root=document.createElementNS(MUGEN_MATHML,'math');

      child.textContent=item;
      sqrt.append(child);
    }
    root.append(sqrt);parent.append(root);
    pos=after;
  }

function fractionize(group,str){

  const units='\\da-zA-Zπ√²³';

function appendMixed(target,text){

let startX=null;$('face').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});$('face').addEventListener('touchend',e=>{if(startX==null)return;let delta=e.changedTouches[0].clientX-startX;if(Math.abs(delta)>45){move(delta<0?1:-1)}startX=null},{passive:true});render();</script></body></html>
