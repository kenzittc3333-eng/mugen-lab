/1998/Math/MathML\" class=\"math-fit\" aria-label=\"x² - 5x + 6=0\"><msup><mrow><mi mathvariant=\"italic\">x</mi></mrow><mn>2</mn></msup><mo>-</mo><mn>5</mn><mi mathvariant=\"italic\">x</mi><mo>+</mo><mn>6</mn><mo>=</mo><mn>0</mn></math></div><div class=\"question-instruction\">を解きなさい。</div>","a":"<div class=\"answer-prose\"><i class=\"prose-var\">x</i>＝2、<i class=\"prose-var\">x</i>＝3</div>"},"MUGEN-OR-317":{"q":"<div class=\"question-prose\">配送会社Aの料金は、荷物が10kg以下で720円、10kg超20kg以下で1050円。会社Bの料金は10kg以下で820円、10kg超20kg以下で960円。8kgの荷物と16kgの荷物を1個ずつ送り、各荷物ごとに安い方を選ぶと合計はいくらか。</div>","a":"<div class=\"answer-equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"math-fit\" aria-label=\"1680円\"><mn>1680</mn><mo>円</mo></math></div>"},"MUGEN-OR-318":{"q":"<div class=\"question-prose\">三角形ABCで辺BCに平行な線分DEを引き、DはAB上、EはAC上とする。AD：DB＝2：3 のとき、台形DBCEの面積は三角形ABCの面積の何倍か。</div>","a":"<div class=\"answer-equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"math-fit\" aria-label=\"21/25 倍\"><mfrac><mrow><mn>21</mn></mrow><mrow><mn>25</mn><mo>倍</mo></mrow></mfrac></math></div>"},"MUGEN-OR-319":{"q":"<div class=\"question-prose\">直角三角形ABCで∠A＝90°、∠B＝38°である。頂点Cから辺ABへ引いた角の二等分線が辺ABと交わる点をDとする。∠ACDを求めなさい。</div>","a":"<div class=\"answer-equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"math-fit\" aria-label=\"26°\"><mn>26</mn><mo>°</mo></math></div>"},"MUGEN-OR-320":{"q":"<div class=\"question-prose\">相似な2つの円錐があり、底面の直径の比が小：大＝2：5 である。小さい円錐の体積は、大きい円錐の体積の何倍か。</div>","a":"<div class=\"answer-equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"math-fit\" aria-label=\"8/125 倍\"><mfrac><mrow><mn>8</mn></mrow><mrow><mn>125</mn><mo>倍</mo></mrow></mfrac></math></div>"}};

function fitMathDisplays(){
 // Prevent horizontal clipping without sacrificing the large type size on short questions.
 const list=document.querySelectorAll('.math-expression math,.system-lines math,.answer-equation math');
 for(const node of list){
   node.style.fontSize='';
   const base=parseFloat(getComputedStyle(node).fontSize);
   const available=Math.max(1,(node.closest('.math-expression,.system-block,.answer-equation')||node.parentElement).clientWidth-12);
   let current=base;
   while(node.getBoundingClientRect().width>available && current>21){
     current-=1.5;
     node.style.fontSize=current+'px';
   }
 }
}
window.addEventListener('resize',()=>requestAnimationFrame(fitMathDisplays));

const $=id=>document.getElementById(id);const state={list:[...DATA],idx:0,show:false};const s=$('series'),c=$('category');
for(const v of [...new Set(DATA.map(x=>x.series))]){const o=document.createElement('option');o.value=v;o.textContent=v+'（'+DATA.filter(x=>x.series===v).length+'問）';s.appendChild(o)}
for(const v of [...new Set(DATA.map(x=>x.category))].sort()){const o=document.createElement('option');o.value=v;o.textContent=v;c.appendChild(o)}
function apply(){const query=$('search').value.trim().toLowerCase();state.list=DATA.filter(o=>(s.value==='all'||o.series===s.value)&&(c.value==='all'||o.category===c.value)&&(!query||(o.question+' '+o.id).toLowerCase().includes(query)));state.idx=0;state.show=false;render()}
function render(){const el=state.list[state.idx];if(!el){$('main').textContent='該当する問題はありません';$('answer').hidden=true;$('explain').hidden=true;$('pic').innerHTML='';$('num').textContent='0問';$('cat').textContent='';$('progress').textContent='';$('hint').textContent='';return}
$('num').textContent=el.id+' ｜ '+el.series;$('cat').textContent=el.category;$('main').innerHTML=RENDERED[el.id].q;$('main').hidden=state.show;$('pic').innerHTML=(!state.show && el.svg)?el.svg:'';$('answer').hidden=!state.show;$('answer').innerHTML=RENDERED[el.id].a;$('explain').hidden=!state.show;$('explain').textContent=el.explanation;$('hint').textContent=state.show?'タップして問題に戻る':'タップして解答を表示';$('toggle').textContent=state.show?'問題に戻す':'解答を見る';$('progress').textContent=(state.idx+1)+' / '+state.list.length+' 問';requestAnimationFrame(fitMathDisplays);}
function toggle(){state.show=!state.show;render()}function move(d){if(!state.list.length)return;state.idx=(state.idx+d+state.list.length)%state.list.length;state.show=false;render()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('toggle').onclick=toggle;$('face').onclick=toggle;$('face').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};s.onchange=apply;c.onchange=apply;$('search').oninput=apply;
$('shuffle').onclick=()=>{for(let i=state.list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.list[i],state.list[j]]=[state.list[j],state.list[i]]}state.idx=0;state.show=false;render()};$('reset').onclick=apply;
$('copy').onclick=async()=>{const cur=state.list[state.idx];if(cur){try{await navigator.clipboard.writeText(cur.question);$('copy').textContent='コピー済み'}catch(e){const t=document.createElement('textarea');t.value=cur.question;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();$('copy').textContent='コピー済み'}setTimeout(()=>$('copy').textContent='問題をコピー',1200)}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')move(1);if(e.key==='ArrowRight')move(-1);if(e.key===' ') {e.preventDefault();toggle()}});
let startX=null;$('face').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});$('face').addEventListener('touchend',e=>{if(startX==null)return;let delta=e.changedTouches[0].clientX-startX;if(Math.abs(delta)>45){move(delta<0?1:-1)}startX=null},{passive:true});render();</script></body></html>
