<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f28a0a">
<title>立体図鑑｜MUGEN LAB</title>
<style>
:root{
  --orange:#f28a0a;
  --orange-dark:#c85c00;
  --orange-deep:#8a3d00;
  --yellow:#ffbf2f;
  --cream:#fff7ea;
  --ink:#6f3300;
  --muted:#8a6646;
  --white:#ffffff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif;
  background:linear-gradient(180deg,#fff8ee 0%,#fff3df 100%);
  color:var(--ink);
}
.wrap{
  width:min(760px,92%);
  margin:0 auto;
  padding:24px 0 42px;
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}
.back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:10px 14px;
  border-radius:999px;
  background:#fff;
  border:2px solid #f0b05b;
  color:var(--orange-deep);
  font-weight:800;
  text-decoration:none;
  box-shadow:0 5px 14px rgba(122,63,0,.08);
}
.logo{
  font-size:13px;
  font-weight:800;
  color:#9a5a1f;
}
.hero{
  background:linear-gradient(135deg,#f28a0a,#f5a623);
  color:#fff;
  border-radius:28px;
  padding:26px 20px 22px;
  box-shadow:0 14px 28px rgba(193,91,0,.22);
  text-align:center;
  position:relative;
  overflow:hidden;
}
.hero:before{
  content:"";
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  right:-70px;top:-80px;
}
.hero h1{
  margin:0;
  font-size:clamp(32px,8vw,48px);
  letter-spacing:.02em;
}
.hero p{
  margin:10px 0 0;
  line-height:1.7;
  font-weight:700;
}
.mascot{
  width:118px;
  height:118px;
  margin:18px auto 0;
  background:#fff5dc;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:5px solid rgba(255,255,255,.92);
  overflow:hidden;
}
.mascot img{
  width:100%;
  height:100%;
  object-fit:contain;
}
.section-title{
  font-size:22px;
  margin:28px 4px 14px;
  font-weight:900;
  color:var(--orange-deep);
}
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}
.card{
  background:#fff;
  border:3px solid #efb35e;
  border-radius:24px;
  padding:22px;
  box-shadow:0 8px 18px rgba(118,67,10,.08);
}
.card.main{
  border-color:#f28a0a;
  background:linear-gradient(180deg,#fff,#fff9ef);
}
.icon{
  font-size:56px;
  line-height:1;
  margin-bottom:10px;
}
.card h2{
  margin:0;
  font-size:27px;
  color:var(--orange-deep);
}
.card p{
  color:var(--muted);
  line-height:1.75;
  margin:10px 0 18px;
}
.btn{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:56px;
  border-radius:16px;
  background:linear-gradient(135deg,#d96400,#f28a0a);
  color:#fff;
  text-decoration:none;
  font-weight:900;
  font-size:18px;
  box-shadow:0 8px 16px rgba(210,100,0,.22);
}
.soon{
  min-height:52px;
  display:flex;
  justify-content:center;
  align-items:center;
  border:2px dashed #efc58a;
  border-radius:16px;
  background:#fff8ef;
  color:#9c754d;
  font-weight:800;
}
footer{
  text-align:center;
  color:#9b7655;
  font-size:12px;
  margin-top:30px;
  line-height:1.7;
}
@media(min-width:680px){
  .grid{grid-template-columns:1fr 1fr}
  .card.main{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a class="back" href="index.html">← MUGEN LABへ</a>
    <div class="logo">総合教育研究所 無限の可能性</div>
  </div>

  <section class="hero">
    <h1>📐 立体図鑑</h1>
    <p>見て・考えて・動かして、<br>立体のしくみを理解しよう！</p>
    <div class="mascot">
      <img src="nankokun.png" alt="なんこうくん">
    </div>
  </section>

  <div class="section-title">立体の教材</div>

  <main class="grid">
    <article class="card main">
      <div class="icon">🧊</div>
      <h2>立方体の切断</h2>
      <p>
        立方体を平面で切ったとき、切り口はどんな形になるのか。
        フラッシュカード形式で、空間図形の見方を身につけます。
      </p>
      <a class="btn"
         href="https://kenzittc3333-eng.github.io/cube-cut/cube-cut.html">
        立方体の切断に挑戦 →
      </a>
    </article>

    <article class="card">
      <div class="icon">📦</div>
      <h2>展開図</h2>
      <p>立体を開いた形から、元の立体をイメージする教材を追加できます。</p>
      <div class="soon">準備中</div>
    </article>

    <article class="card">
      <div class="icon">📏</div>
      <h2>体積・表面積</h2>
      <p>立方体や直方体などの体積・表面積を学ぶ教材を追加できます。</p>
      <div class="soon">準備中</div>
    </article>
  </main>

  <footer>
    MUGEN LAB<br>
    © 総合教育研究所 無限の可能性
  </footer>

</div>
</body>
</html>
