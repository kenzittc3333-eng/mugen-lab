body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#2b180f;background:linear-gradient(180deg,#ff9417 0,#ffc04c 23%,#fff4df 100%)}

<script>
const cards=[{"no": 1, "q": "2x+5x", "a": "7x"}, {"no": 2, "q": "-4a+2a", "a": "-2a"}, {"no": 3, "q": "6x-x", "a": "5x"}, {"no": 4, "q": "-7y-3y", "a": "-10y"}, {"no": 5, "q": "x-\\frac{1}{3}x", "a": "\\frac{2}{3}x"}, {"no": 6, "q": "6x+9-2x", "a": "4x+9"}, {"no": 7, "q": "x+2x-9+3", "a": "3x-6"}, {"no": 8, "q": "2a+1+3a-3", "a": "5a-2"}, {"no": 9, "q": "-7m+10+7m-5", "a": "5"}, {"no": 10, "q": "-3y+6-2y+5", "a": "-5y+11"}, {"no": 11, "q": "-m-7+m+7", "a": "0"}, {"no": 12, "q": "2x+1+3x-3", "a": "5x-2"}, {"no": 13, "q": "-x-7-9x+2", "a": "-10x-5"}, {"no": 14, "q": "2a+(5a+3)", "a": "7a+3"}, {"no": 15, "q": "4x-(6x-7)", "a": "-2x+7"}, {"no": 16, "q": "-y+(2-5y)", "a": "-6y+2"}, {"no": 17, "q": "-2a+3-(8a+9)", "a": "-10a-6"}, {"no": 18, "q": "3x-5+(-9x+8)", "a": "-6x+3"}, {"no": 19, "q": "7t+6-(5t-4)", "a": "2t+10"}, {"no": 20, "q": "3m-4-(6m+3)", "a": "-3m-7"}, {"no": 21, "q": "(2x+9)+(5x-3)", "a": "7x+6"}, {"no": 22, "q": "(2x+9)-(5x-3)", "a": "-3x+12"}, {"no": 23, "q": "(9x-1)+(-7x+2)", "a": "2x+1"}, {"no": 24, "q": "(9x-1)-(-7x+2)", "a": "16x-3"}, {"no": 25, "q": "(-x-5)+(6x+3)", "a": "5x-2"}, {"no": 26, "q": "(-x-5)-(6x+3)", "a": "-7x-8"}, {"no": 27, "q": "(7x-2)+(-2x-4)", "a": "5x-6"}, {"no": 28, "q": "(7x-2)-(-2x-4)", "a": "9x+2"}, {"no": 29, "q": "(-2x+4)+(5x-2)", "a": "3x+2"}, {"no": 30, "q": "(-2x+4)-(5x-2)", "a": "-7x+6"}, {"no": 31, "q": "3x\\times4", "a": "12x"}, {"no": 32, "q": "-x\\times5", "a": "-5x"}, {"no": 33, "q": "-3x\\times(-5)", "a": "15x"}, {"no": 34, "q": "-8x\\times\\frac{3}{4}", "a": "-6x"}, {"no": 35, "q": "\\left(-\\frac{3}{5}x\\right)\\times(-15)", "a": "9x"}, {"no": 36, "q": "-6x\\div2", "a": "-3x"}, {"no": 37, "q": "8x\\div(-4)", "a": "-2x"}, {"no": 38, "q": "5(2x+1)", "a": "10x+5"}, {"no": 39, "q": "2(4x-5)", "a": "8x-10"}, {"no": 40, "q": "-5(3x+7)", "a": "-15x-35"}, {"no": 41, "q": "-7(2x-3)", "a": "-14x+21"}, {"no": 42, "q": "4\\left(\\frac{1}{2}x-2\\right)", "a": "2x-8"}, {"no": 43, "q": "-8\\left(\\frac{3}{4}x+\\frac{1}{2}\\right)", "a": "-6x-4"}, {"no": 44, "q": "(3x+9)\\div3", "a": "x+3"}, {"no": 45, "q": "(10x-5)\\div5", "a": "2x-1"}, {"no": 46, "q": "(-18x+12)\\div6", "a": "-3x+2"}, {"no": 47, "q": "(-12x-6)\\div3", "a": "-4x-2"}, {"no": 48, "q": "(4x-8)\\div(-4)", "a": "-x+2"}, {"no": 49, "q": "(-8x+1)\\div(-2)", "a": "4x-\\frac{1}{2}"}, {"no": 50, "q": "(12x-9)\\div3", "a": "4x-3"}, {"no": 51, "q": "5x+4(7-2x)", "a": "-3x+28"}, {"no": 52, "q": "6(2x-5)-3(5x+7)", "a": "-3x-51"}, {"no": 53, "q": "4(6x+9)-8(3x-4)", "a": "68"}, {"no": 54, "q": "2(x-6)+5(4x+2)", "a": "22x-2"}, {"no": 55, "q": "8(x+3)-2(3x-1)", "a": "2x+26"}, {"no": 56, "q": "-2a\\times6", "a": "-12a"}, {"no": 57, "q": "-6(-2x+1)", "a": "12x-6"}, {"no": 58, "q": "(-4x+10)\\div(-2)", "a": "2x-5"}, {"no": 59, "q": "8-2(3x-1)", "a": "-6x+10"}, {"no": 60, "q": "15\\left(\\frac{3x+10}{5}\\right)", "a": "9x+30"}];
let index=0,showAnswer=false;
function tex(s){return "\\("+s+"\\)"}
async function fitMath(){
 const el=document.getElementById("math"),wrap=document.getElementById("mathWrap");
 let size=window.innerWidth<=600?56:68;
 el.style.fontSize=size+"px";
 await new Promise(r=>requestAnimationFrame(r));
 while(el.scrollWidth>wrap.clientWidth-12&&size>22){size-=2;el.style.fontSize=size+"px";await new Promise(r=>requestAnimationFrame(r));}
}
async function render(){
 const c=cards[index],el=document.getElementById("math");
 document.getElementById("badge").textContent="No. "+c.no;
 document.getElementById("side").textContent=showAnswer?"答え":"問題";
 el.className=showAnswer?"math answer":"math";
 el.innerHTML=tex(showAnswer?c.a:c.q);
 document.getElementById("progressText").textContent=(index+1)+" / "+cards.length;
 document.getElementById("fill").style.width=((index+1)/cards.length*100)+"%";
 document.querySelectorAll(".num").forEach((b,k)=>b.classList.toggle("active",k===index));
 if(window.MathJax&&MathJax.typesetPromise){await MathJax.typesetPromise([el]);await fitMath();}
}
function flipCard(){showAnswer=!showAnswer;render()}
function nextCard(){index=(index+1)%cards.length;showAnswer=false;render()}
function prevCard(){index=(index-1+cards.length)%cards.length;showAnswer=false;render()}
function shuffleCard(){index=Math.floor(Math.random()*cards.length);showAnswer=false;render()}
function jump(n){index=n;showAnswer=false;render()}
const grid=document.getElementById("grid");
cards.forEach((c,k)=>{const b=document.createElement("button");b.className="num";b.textContent=c.no;b.onclick=e=>{e.stopPropagation();jump(k)};grid.appendChild(b)});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")nextCard();if(e.key==="ArrowLeft")prevCard();if(e.key===" "||e.key==="Enter"){e.preventDefault();flipCard()}});
let sx=0;document.addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});
document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].screenX-sx;if(dx<-70)nextCard();if(dx>70)prevCard()},{passive:true});
window.addEventListener("resize",fitMath);
window.addEventListener("load",()=>setTimeout(render,450));
render();
</script>
