<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百マス計算 25マス×４面｜MUGEN学習LAB</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7ec;color:#302b27;font-family:Arial,'Noto Sans JP',sans-serif}main{max-width:780px;margin:auto;padding:22px 18px}header{text-align:center}.brand{font-size:clamp(22px,5vw,32px);font-weight:900;background:linear-gradient(90deg,#db4331,#d07a00,#32853b,#2671c8,#9855ba);background-clip:text;color:transparent}h1{font-size:24px;margin:12px 0 6px}header p{color:#7d6b5b;font-size:14px}nav{display:flex;gap:8px;justify-content:center;margin:22px 0}button,select{font:inherit;cursor:pointer;border:1px solid #e6cfb5;border-radius:14px;padding:12px;background:white;color:#483728}button:focus-visible,select:focus-visible{outline:3px solid #3474cc}nav button{flex:1;max-width:170px;font-weight:bold}nav button.active{background:#e76f17;color:white;border-color:#e76f17}.top{display:flex;justify-content:space-between;align-items:center;font-size:14px}.track{height:8px;background:#eadfce;border-radius:10px;margin:12px 0 20px;overflow:hidden}.track span{display:block;height:100%;background:#ee7a25;transition:width .3s}#card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:330px;width:100%;background:white;border:2px solid #f3b779;border-radius:28px;box-shadow:0 12px 35px #82430b0b;touch-action:pan-y;user-select:none;padding:22px}#position{font-size:14px;color:#9c7757}#equation{font-size:clamp(42px,10vw,76px);font-weight:800;white-space:nowrap;margin:25px 0 15px;font-variant-numeric:tabular-nums}#answer{font-size:clamp(54px,14vw,92px);font-weight:900;color:#d65b0a;line-height:1.2}#hint{font-size:14px;color:#8a7461;margin-top:18px}.controls{display:flex;gap:10px;margin-top:18px}.controls button{flex:1;font-weight:bold}.controls .next{background:#e76f17;color:white;border-color:#e76f17}.note{text-align:center;color:#796551;font-size:13px;margin:17px 0}#cheer{text-align:center;font-weight:bold;min-height:26px;color:#b95014}.bottom{display:flex;gap:10px;justify-content:center;margin-top:12px}dialog{border:0;border-radius:24px;width:min(94vw,760px);padding:22px;color:#302b27}dialog::backdrop{background:#30200d88}.scroll{overflow:auto;max-height:65vh}table{border-collapse:separate;border-spacing:3px;width:100%;min-width:490px;text-align:center;font-size:18px}td,th{padding:10px 6px;border-radius:6px;background:#f3f0eb}th{background:#ffe1be}td.done{background:#ffe3bc;color:#a64706;font-weight:bold}td.current{outline:2px solid #e76f17}dialog h2{font-size:21px}dialog button{margin-top:14px}footer{text-align:center;font-size:12px;color:#907761;margin:25px 0} @media(max-height:720px){#card{min-height:270px}main{padding-top:12px}nav{margin:14px 0}}
#rowstrip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:15px}#rowstrip button{padding:10px 0;border-radius:9px;font-size:clamp(14px,3.7vw,21px)}#rowstrip .done{background:#ffe1be}#rowstrip .selected{outline:3px solid #e76f17}#position{font-size:18px;font-weight:bold;color:#a54e12}a{color:#a54e12}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:18px 0;touch-action:pan-y}.axis,.corner{display:flex;align-items:center;justify-content:center;border-radius:12px;background:#ffe0bb;font-size:clamp(21px,5.5vw,35px);font-weight:800;min-height:46px}.corner{background:#ed751d;color:white}.cell{aspect-ratio:1;min-height:44px;padding:0;font-size:clamp(23px,6vw,42px);font-weight:800;border:2px solid #edc498;border-radius:13px;color:#b8a18a}.cell.revealed{background:#fff0d9;color:#ac470b;border-color:#f1a15b}.cell:active{transform:scale(.97)}.pager{display:flex;gap:8px;margin-top:18px}.pager button{flex:1;padding:10px 4px}.pager .active{background:#e76f17;color:white;border-color:#e76f17}.summary{display:flex;justify-content:space-between;align-items:center;gap:10px}.summary h2{font-size:19px;margin:4px 0}.tip{text-align:center;color:#795c40;font-size:14px}.links{text-align:center;line-height:2}.links a{margin:0 8px}.boardwrap{background:white;border-radius:24px;padding:14px;box-shadow:0 10px 30px #82430b0b}button:disabled{opacity:.4;cursor:default}@media(max-width:370px){.board{gap:4px}.boardwrap{padding:9px}.pager{gap:4px}}
.mascot-header{display:flex;align-items:center;justify-content:center;gap:8px}.mascot-header figure{margin:0;width:90px;flex-shrink:0}.mascot-header img{display:block;width:100%;height:110px;object-fit:contain}.mascot-header figcaption{font-size:11px;font-weight:bold;white-space:nowrap;color:#704525}.mascot-header .brand{background:none;white-space:nowrap;font-size:clamp(22px,5.5vw,36px)}.institute{font-size:13px;margin-bottom:5px;color:#704525}@media(max-width:400px){.mascot-header figure{width:64px}.mascot-header img{height:82px}.mascot-header figcaption{font-size:9px}.mascot-header{gap:5px}}.links{display:none}</style><main><header><div class="mascot-header"><figure><img src="hyakumasu-nankou.png" alt="なんこうくん"><figcaption>なんこうくん</figcaption></figure><div><div class="institute">総合教育研究所</div><div class="brand" aria-label="無限の可能性"><span style="color:#db3030">無</span><span style="color:#df7000">限</span><span style="color:#a08000">の</span><span style="color:#259343">可</span><span style="color:#2376cb">能</span><span style="color:#9546b6">性</span></div></div><figure><img src="hyakumasu-chappy.png" alt="むげんチャッピー"><figcaption>むげんチャッピー</figcaption></figure></div><h1>百マス計算 · 25マス×４面</h1><p>MUGEN学習LAB · 大きなマスで、ひとつずつ</p></header><nav aria-label="計算の種類"><button data-mode="add">たし算</button><button data-mode="sub">ひき算</button><button data-mode="mul">かけ算</button></nav><div class="top"><span>縦・横の数字はランダム配置</span><span id="progress"></span></div><div class="track"><span id="bar"></span></div><div class="pager" aria-label="25マスのページ"><button data-page="0">① 左上</button><button data-page="1">② 右上</button><button data-page="2">③ 左下</button><button data-page="3">④ 右下</button></div><p class="tip">たての数 ＋ よこの数 ／ マスをタッチして答えを見る</p><section class="boardwrap"><div class="summary"><h2 id="pagetitle"></h2><span id="pageprogress"></span></div><div class="board" id="board" aria-label="25マス計算"></div></section><div class="controls"><button id="prev">← 前の25マス</button><button class="next" id="next">次の25マス →</button></div><p class="note">左スワイプで次の面へ ／ 右スワイプで前の面へ</p><div id="cheer" aria-live="polite"></div><div class="bottom"><button id="showgrid">百マス全体を見る</button><button id="reset">数字を並べ直す</button></div><p class="links"><a href="single.html">① １問ずつ版</a><a href="row.html">② １行ずつ版</a></p><p class="note"><a href="index.html">MUGEN学習LABのトップへ</a></p><footer>総合教育研究所　無限の可能性</footer></main><dialog id="grid"><h2>百マス完成表</h2><p id="gridnote"></p><div class="scroll"><table id="table"></table></div><p class="note">答えを確認したマスが色付きで表示されます。横にスクロールできます。</p><button id="close">25マスにもどる</button></dialog><script>
const $=id=>document.getElementById(id), symbols={add:'＋',sub:'−',mul:'×'};
let mode='add',page=0,rows=[],cols=[],seen=new Set(),sets={};
try{sets=JSON.parse(localStorage.getItem('mugen100-quarter-v1')||'{}')||{}}catch(e){}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function valid(a,offset=0){return Array.isArray(a)&&a.length===10&&new Set(a).size===10&&a.every(n=>Number.isInteger(n)&&n>=offset&&n<offset+10)}
function result(a,b){return mode==='add'?a+b:mode==='sub'?a-b:a*b}
function pageIds(p){let ids=[],rs=Math.floor(p/2)*5,cs=(p%2)*5;for(let r=rs;r<rs+5;r++)for(let c=cs;c<cs+5;c++)ids.push(r*10+c);return ids}
function save(){sets[mode]={rows,cols,page,seen:[...seen]};try{localStorage.setItem('mugen100-quarter-v1',JSON.stringify(sets))}catch(e){}}
function start(restore=false){const s=restore&&sets[mode],offset=mode==='sub'?10:0;if(s&&valid(s.rows,offset)&&valid(s.cols)){rows=s.rows;cols=s.cols;page=Number.isInteger(s.page)?Math.max(0,Math.min(3,s.page)):0;seen=new Set((s.seen||[]).filter(n=>Number.isInteger(n)&&n>=0&&n<100))}else{rows=shuffle(Array.from({length:10},(_,i)=>i+offset));cols=shuffle(Array.from({length:10},(_,i)=>i));page=0;seen=new Set()}render();save()}
function render(){document.querySelectorAll('[data-mode]').forEach(el=>{el.classList.toggle('active',el.dataset.mode===mode);el.setAttribute('aria-pressed',el.dataset.mode===mode)});document.querySelectorAll('[data-page]').forEach(el=>{el.classList.toggle('active',+el.dataset.page===page);el.setAttribute('aria-pressed',+el.dataset.page===page)});$('progress').textContent=`${seen.size} / 100 マス`;$('bar').style.width=seen.size+'%';$('pagetitle').textContent=`${['① 左上','② 右上','③ 左下','④ 右下'][page]}の25マス`;
const ids=pageIds(page),done=ids.filter(id=>seen.has(id)).length;$('pageprogress').textContent=`${done} / 25 マス`;$('cheer').textContent=seen.size===100?'100マス完成！ よくがんばったね！':done===25?'25マス完成！ 次の面にも挑戦しよう！':'答えを考えてから、マスをタッチしよう';$('prev').disabled=page===0;$('next').textContent=page===3?'百マス全体を見る →':'次の25マス →';document.querySelector('.tip').textContent=`たての数 ${symbols[mode]} よこの数 ／ マスをタッチして答えを見る`;
let rs=Math.floor(page/2)*5,cs=(page%2)*5;const board=$('board');board.replaceChildren();function axis(text,cl){const el=document.createElement('div');el.className=cl;el.textContent=text;board.append(el)}axis(symbols[mode],'corner');for(let c=cs;c<cs+5;c++)axis(cols[c],'axis');for(let r=rs;r<rs+5;r++){axis(rows[r],'axis');for(let c=cs;c<cs+5;c++){const id=r*10+c,button=document.createElement('button');button.className='cell'+(seen.has(id)?' revealed':'');button.textContent=seen.has(id)?result(rows[r],cols[c]):'？';button.setAttribute('aria-label',`${rows[r]} ${symbols[mode]} ${cols[c]} ${seen.has(id)?'答え '+result(rows[r],cols[c]):'答えを見る'}`);button.onclick=()=>{if(Date.now()<suppressUntil)return;seen.add(id);render();save()};board.append(button)}}}
function grid(){$('gridnote').textContent=`${seen.size} / 100 マス完成 · たての数 ${symbols[mode]} よこの数`;$('table').innerHTML='<thead><tr><th scope="col">'+symbols[mode]+'</th>'+cols.map(n=>'<th scope="col">'+n+'</th>').join('')+'</tr></thead><tbody>'+rows.map((n,r)=>'<tr><th scope="row">'+n+'</th>'+cols.map((v,c)=>{const id=r*10+c;return '<td class="'+(seen.has(id)?'done':'')+'">'+(seen.has(id)?result(n,v):'·')+'</td>'}).join('')+'</tr>').join('')+'</tbody>';$('grid').showModal()}
function move(d){if(d===1&&page===3){grid();return}page=Math.max(0,Math.min(3,page+d));render();save()}
document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{save();mode=el.dataset.mode;start(true)});document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{page=+el.dataset.page;render();save()});$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('showgrid').onclick=grid;$('close').onclick=()=>$('grid').close();$('reset').onclick=()=>{if(confirm('この計算の記録を消し、縦と横の数字を並べ直しますか？'))start()};let down=null,suppressUntil=0;$('board').addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});$('board').addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5){suppressUntil=Date.now()+500;move(dx<0?1:-1)}else if(Math.abs(dx)>15||Math.abs(dy)>15)suppressUntil=Date.now()+500});$('board').addEventListener('pointercancel',()=>down=null);start(true);
</script></html>
